<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Comparison of Explicit Errors versus Silent Errors in Scientific Computing">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; text-anchor: middle; }
      .col-header { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .box-bg { fill: #f8fafc; stroke: #cbd5e0; stroke-width: 1.5; rx: 8px; }
      .box-error-explicit { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 8px; }
      .box-error-silent { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; rx: 8px; }
      .label-main { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .label-sub { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .text-explicit { fill: #991b1b; }
      .text-silent { fill: #92400e; }
      .arrow { stroke: #475569; stroke-width: 1.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
      .divider { stroke: #e2e8f0; stroke-width: 1.5; stroke-dasharray: 4 4; }
    </style>

    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="820" height="380" />

  <!-- Main Title -->
  <text x="410" y="42" class="title">Computational Error Modes</text>
  <text x="410" y="62" class="subtitle">Execution halts versus undetected corruption</text>

  <!-- Vertical Divider -->
  <line x1="410" y1="88" x2="410" y2="340" class="divider" />

  <!-- ================= LEFT COLUMN: EXPLICIT ERRORS ================= -->
  <text x="220" y="102" class="col-header text-explicit">Explicit Errors</text>

  <!-- Step 1: Input/Code -->
  <g transform="translate(130, 120)">
    <rect class="box-bg" width="180" height="54" x="0" y="0" />
    <text x="90" y="24" class="label-main">Code Execution</text>
    <text x="90" y="40" class="label-sub">Invalid Syntax / Type</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 220 174 L 220 200" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 2: System Halt -->
  <g transform="translate(130, 202)">
    <rect class="box-error-explicit" width="180" height="54" x="0" y="0" />
    <text x="90" y="24" class="label-main text-explicit">Execution Halt</text>
    <text x="90" y="40" class="label-sub text-explicit">Throws Exception / Stack Trace</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 220 256 L 220 282" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 3: Outcome -->
  <g transform="translate(130, 284)">
    <rect class="box-bg" width="180" height="54" x="0" y="0" />
    <text x="90" y="24" class="label-main">Immediate Notice</text>
    <text x="90" y="40" class="label-sub">Prevented Wrong Output</text>
  </g>


  <!-- ================= RIGHT COLUMN: SILENT ERRORS ================= -->
  <text x="600" y="102" class="col-header text-silent">Silent Errors</text>

  <!-- Step 1: Input/Code -->
  <g transform="translate(510, 120)">
    <rect class="box-bg" width="180" height="54" x="0" y="0" />
    <text x="90" y="24" class="label-main">Code Execution</text>
    <text x="90" y="40" class="label-sub">Valid Syntax / Bad Logic</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 600 174 L 600 200" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 2: Flawed State -->
  <g transform="translate(510, 202)">
    <rect class="box-error-silent" width="180" height="54" x="0" y="0" />
    <text x="90" y="24" class="label-main text-silent">Silent Defect</text>
    <text x="90" y="40" class="label-sub text-silent">Wrong Index / Unit Mismatch</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 600 256 L 600 282" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 3: Outcome -->
  <g transform="translate(510, 284)">
    <rect class="box-bg" width="180" height="54" x="0" y="0" />
    <text x="90" y="24" class="label-main">Corrupted Results</text>
    <text x="90" y="40" class="label-sub">Plausible Wrong Output</text>
  </g>

<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>