<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Diagram showing how a missing closing brace causes runaway macro expansion and memory limits">
  <defs>
    <!-- Marker for normal flow arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a1a1a" />
    </marker>
    <!-- Marker for error/branch arrows -->
    <marker id="arrow-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e53e3e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" fill="#ffffff" />

  <!-- Title -->
  <text x="40" y="45" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="600" fill="#1a1a1a" letter-spacing="0.2">
    MACRO EXPANSION FAILURE MODE: UNCLOSED PARAMETER
  </text>

  <!-- Node 1: Source File Input -->
  <g transform="translate(40, 90)">
    <rect width="200" height="110" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5" />
    <text x="100" y="30" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Source File Input</text>
    <rect x="25" y="45" width="150" height="48" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="100" y="64" font-family="monospace" font-size="12" fill="#e53e3e" text-anchor="middle">FOO( arg1, arg2</text>
    <text x="100" y="81" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" fill="#718096" text-anchor="middle">[ Missing closing ')' ]</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 240 145 L 282 145" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Node 2: Macro Expansion Phase -->
  <g transform="translate(290, 90)">
    <rect width="220" height="110" rx="8" fill="#f6f8fc" stroke="#1a1a1a" stroke-width="1.5" />
    <text x="110" y="32" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Macro Expansion Phase</text>
    <text x="110" y="58" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#4a5568" text-anchor="middle">Scans text continuously</text>
    <text x="110" y="76" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#4a5568" text-anchor="middle">seeking parameter delimiter</text>
    <text x="110" y="94" font-family="monospace" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">Stream mode: ACTIVE</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 510 145 L 552 145" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Node 3: Unbounded Token Stream -->
  <g transform="translate(560, 90)">
    <rect width="220" height="110" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5" />
    <text x="110" y="32" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Runaway Token Stream</text>
    <text x="110" y="58" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#4a5568" text-anchor="middle">Consumes subsequent source</text>
    <text x="110" y="76" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#4a5568" text-anchor="middle">code into macro argument</text>
    <text x="110" y="94" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-style="italic" fill="#718096" text-anchor="middle">"Eats" downstream tokens</text>
  </g>

  <!-- Arrow 3 -> Downstream Failure paths -->
  <!-- Split route down -->
  <path d="M 670 200 L 670 235" fill="none" stroke="#cbd5e0" stroke-width="1.5" />
  <path d="M 400 235 L 670 235" fill="none" stroke="#cbd5e0" stroke-width="1.5" />
  
  <!-- Arrow to Node 4 -->
  <path d="M 400 235 L 400 258" fill="none" stroke="#e53e3e" stroke-width="1.5" marker-end="url(#arrow-error)" />
  <!-- Arrow to Node 5 -->
  <path d="M 670 235 L 670 258" fill="none" stroke="#e53e3e" stroke-width="1.5" marker-end="url(#arrow-error)" />

  <!-- Node 4: Memory Limit Exceeded -->
  <g transform="translate(290, 260)">
    <rect width="220" height="85" rx="8" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5" />
    <text x="110" y="28" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#c53030" text-anchor="middle">Compiler Fatal Error</text>
    <text x="110" y="48" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#742a2a" text-anchor="middle">Macro buffer exhaustion</text>
    <text x="110" y="66" font-family="monospace" font-size="11" fill="#9b2c2c" text-anchor="middle">Out of Memory / Heap Overflow</text>
  </g>

  <!-- Node 5: Cascading Syntax Failure -->
  <g transform="translate(560, 260)">
    <rect width="220" height="85" rx="8" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5" />
    <text x="110" y="28" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#c53030" text-anchor="middle">Downstream Breakage</text>
    <text x="110" y="48" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#742a2a" text-anchor="middle">Unexpected EOF or missing</text>
    <text x="110" y="66" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#742a2a" text-anchor="middle">context boundaries</text>
  </g>
<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>