<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Flowchart showing source files feeding into latexdiff to produce a highlighted diff.tex file">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box-light { fill: #f6f8fc; stroke: #cbd5e0; stroke-width: 1.5; rx: 8px; }
      .box-accent { fill: #1a1a1a; stroke: #1a1a1a; stroke-width: 1.5; rx: 8px; }
      .text-title { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
      .text-body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; fill: #333333; text-anchor: middle; }
      .text-light { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #ffffff; text-anchor: middle; }
      .arrow { fill: none; stroke: #1a1a1a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a1a1a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" class="bg" />

  <!-- Diagram Title / Header -->
  <text x="410" y="45" class="text-title">latexdiff Mechanism &amp; Workflow</text>

  <!-- Input Files Column (Stacked vertically on the left) -->
  <!-- Old File -->
  <g transform="translate(50, 85)">
    <rect width="160" height="60" class="box-light" />
    <text x="80" y="27" class="text-title" font-size="13">Original File</text>
    <text x="80" y="45" class="text-body">old.tex</text>
  </g>

  <!-- New File -->
  <g transform="translate(50, 215)">
    <rect width="160" height="60" class="box-light" />
    <text x="80" y="27" class="text-title" font-size="13">Updated File</text>
    <text x="80" y="45" class="text-body">new.tex</text>
  </g>

  <!-- Merging Arrows to Engine -->
  <path d="M 210 115 L 290 175" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 210 245 L 290 185" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Core Engine: latexdiff -->
  <g transform="translate(295, 140)">
    <rect width="160" height="80" class="box-accent" />
    <text x="80" y="35" class="text-light" font-size="15">latexdiff</text>
    <text x="80" y="55" class="text-light" font-size="11" fill="#cbd5e0">Comparison Engine</text>
  </g>

  <!-- Arrow to Output -->
  <path d="M 455 180 L 565 180" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Output File -->
  <g transform="translate(570, 140)">
    <rect width="190" height="80" class="box-light" />
    <text x="95" y="35" class="text-title">Highlighted Output</text>
    <text x="95" y="55" class="text-body">diff.tex (Markup Added)</text>
  </g>

<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>