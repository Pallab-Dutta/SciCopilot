<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Decision tree flowchart for addressing errors in published scientific papers">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #1a1a1a; letter-spacing: 0.2px; }
      .node-title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .node-desc { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #555555; }
      .edge-label { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #1a1a1a; }
      .box { fill: #f8fafc; stroke: #cbd5e0; stroke-width: 1.5; rx: 8px; }
      .box-start { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; rx: 8px; }
      .box-result { fill: #f8fafc; stroke: #1a1a1a; stroke-width: 1.5; rx: 8px; }
      .line { fill: none; stroke: #1a1a1a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orientation="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#1a1a1a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="820" height="380" />

  <!-- Diagram Title -->
  <text x="40" y="42" class="title">Post-Publication Error Resolution Workflow</text>

  <!-- NODES -->
  
  <!-- 1. Start: Error Identified -->
  <g transform="translate(40, 150)">
    <rect class="box-start" width="130" height="60" rx="8" />
    <text x="65" y="28" text-anchor="middle" class="node-title">Error Identified</text>
    <text x="65" y="44" text-anchor="middle" class="node-desc">in code or data</text>
  </g>

  <!-- 2. Re-run Pipeline -->
  <g transform="translate(210, 150)">
    <rect class="box" width="140" height="60" rx="8" />
    <text x="70" y="28" text-anchor="middle" class="node-title">Re-run Pipeline</text>
    <text x="70" y="44" text-anchor="middle" class="node-desc">apply corrections</text>
  </g>

  <!-- 3. Decision: Core Conclusions Hold? -->
  <g transform="translate(390, 140)">
    <rect class="box" width="160" height="80" rx="8" />
    <text x="80" y="36" text-anchor="middle" class="node-title">Do Core</text>
    <text x="80" y="52" text-anchor="middle" class="node-title">Conclusions Hold?</text>
  </g>

  <!-- 4. Result: Corrigendum -->
  <g transform="translate(620, 80)">
    <rect class="box-result" width="160" height="70" rx="8" />
    <text x="80" y="32" text-anchor="middle" class="node-title">Issue Corrigendum</text>
    <text x="80" y="48" text-anchor="middle" class="node-desc">Correct text or data;</text>
    <text x="80" y="60" text-anchor="middle" class="node-desc">findings remain valid</text>
  </g>

  <!-- 5. Result: Retraction -->
  <g transform="translate(620, 210)">
    <rect class="box-result" width="160" height="70" rx="8" />
    <text x="80" y="32" text-anchor="middle" class="node-title">Issue Retraction</text>
    <text x="80" y="48" text-anchor="middle" class="node-desc">Withdraw paper;</text>
    <text x="80" y="60" text-anchor="middle" class="node-desc">main claims invalid</text>
  </g>

  <!-- PATHS & ARROWS -->

  <!-- Node 1 to Node 2 -->
  <path class="line" d="M 170 180 L 210 180" marker-end="url(#arrow)" />

  <!-- Node 2 to Node 3 -->
  <path class="line" d="M 350 180 L 390 180" marker-end="url(#arrow)" />

  <!-- Node 3 to Node 4 (YES - Up and Right) -->
  <path class="line" d="M 470 140 L 470 115 L 620 115" marker-end="url(#arrow)" />
  <!-- Yes Label Background & Text -->
  <rect x="480" y="98" width="32" height="16" fill="#ffffff" rx="2" />
  <text x="482" y="111" class="edge-label">YES</text>

  <!-- Node 3 to Node 5 (NO - Down and Right) -->
  <path class="line" d="M 470 220 L 470 245 L 620 245" marker-end="url(#arrow)" />
  <!-- No Label Background & Text -->
  <rect x="480" y="228" width="28" height="16" fill="#ffffff" rx="2" />
  <text x="482" y="241" class="edge-label">NO</text>

<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>