<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Diagram showing integration of a published article and erratum into a dissertation chapter">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #1a1a1a; }
      .label-main { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .label-sub { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #555555; }
      .badge-text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .box { fill: #f6f8fc; stroke: #cbd5e0; stroke-width: 1.5; rx: 8px; }
      .box-accent { fill: #f0f4f9; stroke: #2b6cb0; stroke-width: 1.5; rx: 8px; }
      .box-erratum { fill: #fff5f5; stroke: #e53e3e; stroke-width: 1.5; rx: 8px; }
      .arrow { stroke: #4a5568; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-accent { stroke: #2b6cb0; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .container { fill: #fafbfc; stroke: #e2e8f0; stroke-width: 1.5; stroke-dasharray: 4 4; rx: 10px; }
    </style>
    
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a5568" />
    </marker>
    <marker id="arrowhead-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2b6cb0" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" fill="#ffffff" />

  <!-- Main Diagram Title -->
  <text x="410" y="36" class="title" text-anchor="middle">Integrating a Published Article &amp; Erratum into a Dissertation Chapter</text>

  <!-- Section 1: Published Sources Group -->
  <rect x="40" y="65" width="220" height="275" class="container" />
  <text x="150" y="88" class="label-sub" font-weight="600" text-anchor="middle">PUBLISHED MATERIALS</text>

  <!-- Original Article Box -->
  <rect x="60" y="105" width="180" height="90" class="box" />
  <text x="150" y="138" class="label-main" text-anchor="middle">Original Article</text>
  <text x="150" y="156" class="label-sub" text-anchor="middle">Published Journal PDF</text>
  <text x="150" y="172" class="label-sub" text-anchor="middle">(Contains errors/omissions)</text>

  <!-- Erratum Box -->
  <rect x="60" y="225" width="180" height="90" class="box-erratum" />
  <text x="150" y="258" class="label-main" fill="#c53030" text-anchor="middle">Published Erratum</text>
  <text x="150" y="276" class="label-sub" text-anchor="middle">Correction Notice</text>
  <text x="150" y="292" class="label-sub" text-anchor="middle">(Formal amendments)</text>

  <!-- Section 2: Integration Process -->
  <!-- Arrow from Article to Integration -->
  <path d="M 240 150 L 330 150" class="arrow" marker-end="url(#arrowhead)" />
  
  <!-- Arrow from Erratum to Integration -->
  <path d="M 240 270 L 300 270 L 300 210 L 330 210" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Integration Action Box -->
  <rect x="330" y="125" width="160" height="110" class="box" />
  <text x="410" y="155" class="label-main" text-anchor="middle">Synthesis Process</text>
  <text x="410" y="178" class="label-sub" text-anchor="middle">• Correct text in-line</text>
  <text x="410" y="196" class="label-sub" text-anchor="middle">• Update figures/data</text>
  <text x="410" y="214" class="label-sub" text-anchor="middle">• Add attribution note</text>

  <!-- Arrow from Integration to Final Chapter -->
  <path d="M 490 180 L 560 180" class="arrow-accent" marker-end="url(#arrowhead-blue)" />

  <!-- Section 3: Final Dissertation Chapter -->
  <rect x="560" y="65" width="220" height="275" class="box-accent" />
  <text x="670" y="95" class="label-main" fill="#2b6cb0" text-anchor="middle">Dissertation Chapter</text>
  <text x="670" y="113" class="label-sub" text-anchor="middle">(Integrated Version)</text>

  <!-- Chapter Content Elements -->
  <!-- Element 1: Chapter Text -->
  <rect x="580" y="130" width="180" height="50" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <text x="670" y="152" class="label-sub" font-weight="600" text-anchor="middle">Corrected Main Text</text>
  <text x="670" y="167" class="label-sub" text-anchor="middle">Seamlessly unified content</text>

  <!-- Element 2: Prefatory Note / Footnote -->
  <rect x="580" y="195" width="180" height="65" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <rect x="588" y="203" width="62" height="16" rx="3" fill="#2b6cb0" />
  <text x="619" y="215" class="badge-text" text-anchor="middle">FOOTNOTE</text>
  <text x="670" y="234" class="label-sub" font-weight="600" text-anchor="middle">Attribution &amp; Context</text>
  <text x="670" y="249" class="label-sub" text-anchor="middle">Notes original publication &amp; erratum</text>

  <!-- Element 3: Appendices -->
  <rect x="580" y="275" width="180" height="45" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <text x="670" y="294" class="label-sub" font-weight="600" text-anchor="middle">Appendix</text>
  <text x="670" y="309" class="label-sub" text-anchor="middle">Includes copies of both publications</text>

<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>