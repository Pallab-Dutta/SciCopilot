<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Multi-layer origin of author guidelines diagram">
  <style>
    .title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #2f6fed; }
    .subtitle { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
    .box-desc { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .outcome-title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #2f6fed; }
    .outcome-desc { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
    .label { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #2f6fed; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2f6fed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="42" class="title">Multi-Layer Origin of Author Guidelines</text>
  <text x="40" y="60" class="subtitle">Overlapping institutional layers creating ambiguous submission requirements</text>

  <!-- LAYER 1: Publisher Infrastructure -->
  <g transform="translate(40, 88)">
    <rect width="240" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="20" y="32" class="box-title">Publisher Infrastructure</text>
    <text x="20" y="50" class="box-desc">Platform limits &amp; file formats</text>
  </g>

  <!-- LAYER 2: Editorial Policy -->
  <g transform="translate(40, 176)">
    <rect width="240" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="20" y="32" class="box-title">Editorial Policy</text>
    <text x="20" y="50" class="box-desc">Journal scope &amp; peer review style</text>
  </g>

  <!-- LAYER 3: System Metadata -->
  <g transform="translate(40, 264)">
    <rect width="240" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="20" y="32" class="box-title">System Metadata</text>
    <text x="20" y="50" class="box-desc">Indexing fields &amp; taxonomy tags</text>
  </g>

  <!-- CONVERGENCE NODE (Overlapping Synthesis) -->
  <g transform="translate(370, 152)">
    <rect width="140" height="120" rx="8" fill="#f0f5ff" stroke="#2f6fed" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="70" y="54" class="label" text-anchor="middle">Layer</text>
    <text x="70" y="70" class="label" text-anchor="middle">Intersection</text>
  </g>

  <!-- OUTCOME NODE (Ambiguous Requirements) -->
  <g transform="translate(580, 152)">
    <rect width="200" height="120" rx="8" fill="#f8fafc" stroke="#2f6fed" stroke-width="1.5"/>
    <text x="100" y="48" class="outcome-title" text-anchor="middle">Ambiguous</text>
    <text x="100" y="66" class="outcome-title" text-anchor="middle">Requirements</text>
    <text x="100" y="94" class="outcome-desc" text-anchor="middle">Conflicting author</text>
    <text x="100" y="108" class="outcome-desc" text-anchor="middle">instructions</text>
  </g>

  <!-- ARROWS: Layers to Convergence -->
  <!-- Top Layer -> Convergence -->
  <path d="M 280 124 L 370 178" fill="none" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Middle Layer -> Convergence -->
  <path d="M 280 212 L 370 212" fill="none" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Bottom Layer -> Convergence -->
  <path d="M 280 300 L 370 246" fill="none" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ARROW: Convergence to Outcome -->
  <path d="M 510 212 L 580 212" fill="none" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow)"/>
<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>