<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Diagram comparing Methodological Theatricality with Rigorous Computational Qualitative Analysis">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2f6fed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" fill="#ffffff"/>

  <!-- SECTION A: METHODOLOGICAL THEATRICALITY -->
  <text x="50" y="45" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">
    A. METHODOLOGICAL THEATRICALITY (NAIVE / PERFORMATIVE)
  </text>

  <!-- Box 1A -->
  <rect x="50" y="65" width="190" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="145" y="96" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" text-anchor="middle">
    <tspan x="145" dy="0" font-size="13" font-weight="600" fill="#333333">Qualitative Data</tspan>
    <tspan x="145" dy="18" font-size="11" fill="#64748b">Raw text transcripts</tspan>
  </text>

  <!-- Arrow 1A -> 1B -->
  <line x1="240" y1="101" x2="288" y2="101" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Box 1B -->
  <rect x="290" y="65" width="210" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="395" y="96" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" text-anchor="middle">
    <tspan x="395" dy="0" font-size="13" font-weight="600" fill="#333333">Basic ML Clustering</tspan>
    <tspan x="395" dy="18" font-size="11" fill="#64748b">Unguided embeddings / K-Means</tspan>
  </text>

  <!-- Arrow 1B -> 1C -->
  <line x1="500" y1="101" x2="548" y2="101" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Box 1C -->
  <rect x="550" y="65" width="220" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="660" y="96" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" text-anchor="middle">
    <tspan x="660" dy="0" font-size="13" font-weight="600" fill="#333333">Low-Validity Artifacts</tspan>
    <tspan x="660" dy="18" font-size="11" fill="#64748b">Superficial &amp; opaque clusters</tspan>
  </text>

  <!-- DIVIDER LINE -->
  <line x1="50" y1="175" x2="770" y2="175" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- SECTION B: RIGOROUS COMPUTATIONAL QUALITATIVE ANALYSIS -->
  <text x="50" y="212" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#2f6fed" letter-spacing="0.5">
    B. RIGOROUS COMPUTATIONAL QUALITATIVE ANALYSIS
  </text>

  <!-- Box 2A -->
  <rect x="50" y="232" width="190" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="145" y="267" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" text-anchor="middle">
    <tspan x="145" dy="0" font-size="13" font-weight="600" fill="#333333">Qualitative Data</tspan>
    <tspan x="145" dy="18" font-size="11" fill="#64748b">Context-rich empirical text</tspan>
  </text>

  <!-- Arrow 2A -> 2B -->
  <line x1="240" y1="276" x2="278" y2="276" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Box 2B -->
  <rect x="280" y="232" width="230" height="88" rx="8" fill="#f0f5ff" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="395" y="260" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" text-anchor="middle">
    <tspan x="395" dy="0" font-size="13" font-weight="600" fill="#2f6fed">Explicit Epistemological</tspan>
    <tspan x="395" dy="16" font-size="13" font-weight="600" fill="#2f6fed">Schemas</tspan>
    <tspan x="395" dy="18" font-size="11" fill="#64748b">Theory-guided rules &amp; coding</tspan>
  </text>

  <!-- Arrow 2B -> 2C -->
  <line x1="510" y1="276" x2="548" y2="276" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Box 2C -->
  <rect x="550" y="232" width="220" height="88" rx="8" fill="#f0f5ff" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="660" y="260" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" text-anchor="middle">
    <tspan x="660" dy="0" font-size="13" font-weight="600" fill="#2f6fed">Prompt Audits &amp;</tspan>
    <tspan x="660" dy="16" font-size="13" font-weight="600" fill="#2f6fed">Validated Findings</tspan>
    <tspan x="660" dy="18" font-size="11" fill="#64748b">Reflexive verification &amp; rigor</tspan>
  </text>
<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>