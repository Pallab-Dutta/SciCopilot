<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Quadrant matrix mapping Analytical Depth against Methodological Transparency">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2f6fed" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" fill="#ffffff" />

  <!-- Diagram Title -->
  <text x="450" y="36" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="1.5">METHODOLOGICAL EVALUATION FRAMEWORK</text>

  <!-- AXES -->
  <!-- Y-Axis (Analytical Depth) -->
  <line x1="140" y1="295" x2="140" y2="58" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <!-- X-Axis (Methodological Transparency) -->
  <line x1="135" y1="290" x2="762" y2="290" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- Axis Titles -->
  <text x="70" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle" transform="rotate(-90, 70, 172)">Analytical Depth</text>
  <text x="450" y="332" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Methodological Transparency</text>

  <!-- Axis Labels (Low / High) -->
  <text x="125" y="280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end">Low</text>
  <text x="125" y="75" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end">High</text>
  
  <text x="160" y="310" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start">Low</text>
  <text x="740" y="310" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end">High</text>

  <!-- QUADRANT BOXES -->

  <!-- Top-Left Quadrant: Black-Box Analytics -->
  <g transform="translate(155, 65)">
    <rect width="285" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="142" y="45" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">Black-Box Analytics</text>
    <text x="142" y="65" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">High Depth · Low Transparency</text>
  </g>

  <!-- Top-Right Quadrant: Audited AI Workflows (KEY TARGET) -->
  <g transform="translate(455, 65)">
    <rect width="285" height="100" rx="8" fill="#eff6ff" stroke="#2f6fed" stroke-width="2" />
    
    <!-- Tag/Badge -->
    <rect x="195" y="12" width="78" height="20" rx="4" fill="#2f6fed" />
    <text x="234" y="26" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">TARGET</text>
    
    <text x="142" y="48" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#2f6fed" text-anchor="middle">Audited AI Workflows</text>
    <text x="142" y="68" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">High Depth · High Transparency</text>
  </g>

  <!-- Bottom-Left Quadrant: Performative ML Scripts (KEY TARGET) -->
  <g transform="translate(155, 175)">
    <rect width="285" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5" />
    <text x="142" y="45" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Performative ML Scripts</text>
    <text x="142" y="65" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Low Depth · Low Transparency</text>
  </g>

  <!-- Bottom-Right Quadrant: Surface Benchmarks -->
  <g transform="translate(455, 175)">
    <rect width="285" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="142" y="45" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">Surface Benchmarks</text>
    <text x="142" y="65" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">Low Depth · High Transparency</text>
  </g>

  <!-- Transition Arrow (Low/Low -> High/High) -->
  <path d="M 370 175 C 370 145, 420 145, 447 130" fill="none" stroke="#2f6fed" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-blue)" />
<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>