<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Subdued Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>

    <!-- Subtle Drop Shadows -->
    <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <filter id="shadow-alert" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#dc2626" flood-opacity="0.08"/>
    </filter>

    <style>
      /* Scanner animation strictly contained within the text/chart area (0px to 210px) */
      @keyframes scanVertical {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(210px); opacity: 0; }
      }

      /* Subtle breathing glow effect on alert badge - accelerated duration from 3s to 1.5s */
      @keyframes alertGlow {
        0%, 100% { stroke-opacity: 0.4; filter: drop-shadow(0 0 0px rgba(220, 38, 38, 0)); }
        50% { stroke-opacity: 0.9; filter: drop-shadow(0 2px 8px rgba(220, 38, 38, 0.25)); }
      }

      /* Pulse node speed accelerated from 2s to 1s */
      @keyframes falsePositiveNode {
        0%, 100% { r: 3.5px; opacity: 1; }
        50% { r: 6px; opacity: 0.6; }
      }

      .scanner-line { animation: scanVertical 3.5s ease-in-out infinite; }
      .alert-box { animation: alertGlow 1.5s ease-in-out infinite; }
      .fp-node { animation: falsePositiveNode 1s ease-in-out infinite; }
      
      .title-text { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 700; fill: #0f172a; }
      .subtitle-text { font-family: 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 400; fill: #475569; }
      .mono-text { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <!-- Clean Academic Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- LEFT SECTION: Clear Hierarchy & Context -->
  <g transform="translate(80, 0)">
    
    <!-- Category Badge -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="175" height="24" rx="4" fill="#f1f5f9"/>
      <text x="12" y="16" class="mono-text" font-size="10" font-weight="600" fill="#0369a1" letter-spacing="1.2">RESEARCH METHODOLOGY</text>
    </g>

    <!-- Unified Title Block -->
    <g transform="translate(0, 135)">
      <text x="0" y="0" class="title-text" font-size="36" letter-spacing="-0.5">Why AI Detectors Flag</text>
      <text x="0" y="46" class="title-text" font-size="36" fill="#0284c7" letter-spacing="-0.5">Human-Written Scientific Writing</text>
      <text x="0" y="88" class="subtitle-text" font-size="18" fill="#64748b">The Mechanics of False Positives</text>
    </g>

    <!-- Metric 1: Perplexity Card -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="420" height="105" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow-soft)"/>
      
      <text x="20" y="28" class="title-text" font-size="14">Low Perplexity Predictability</text>
      <text x="20" y="45" class="subtitle-text" font-size="12" fill="#64748b">Rigid, discipline-specific vocabulary</text>
      <text x="400" y="28" class="mono-text" font-size="10" font-weight="600" fill="#0284c7" text-anchor="end">LOW VARIANCE</text>

      <!-- Smooth Curve -->
      <path d="M 20 85 L 400 85" stroke="#f1f5f9" stroke-width="1"/>
      <path d="M 20 85 Q 110 83, 170 52 Q 210 32, 250 52 T 400 85" fill="none" stroke="#0284c7" stroke-width="1.5"/>
      <path d="M 20 85 Q 110 83, 170 52 Q 210 32, 250 52 T 400 85 Z" fill="#0284c7" fill-opacity="0.05"/>
    </g>

    <!-- Metric 2: Burstiness Card -->
    <g transform="translate(0, 400)">
      <rect x="0" y="0" width="420" height="105" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow-soft)"/>
      
      <text x="20" y="28" class="title-text" font-size="14">Low Burstiness (Sentence Length)</text>
      <text x="20" y="45" class="subtitle-text" font-size="12" fill="#64748b">Uniform structure from strict style guidelines</text>
      <text x="400" y="28" class="mono-text" font-size="10" font-weight="600" fill="#b91c1c" text-anchor="end">UNIFORM RHYTHM</text>

      <!-- De-cluttered Bars -->
      <g transform="translate(20, 62)">
        <rect x="0" y="8" width="22" height="12" rx="1" fill="#cbd5e1"/>
        <rect x="30" y="6" width="22" height="14" rx="1" fill="#cbd5e1"/>
        <rect x="60" y="7" width="22" height="13" rx="1" fill="#cbd5e1"/>
        <rect x="90" y="7" width="22" height="13" rx="1" fill="#ef4444"/>
        <rect x="120" y="6" width="22" height="14" rx="1" fill="#cbd5e1"/>
        <rect x="150" y="7" width="22" height="13" rx="1" fill="#cbd5e1"/>
        <rect x="180" y="7" width="22" height="13" rx="1" fill="#cbd5e1"/>
        <rect x="210" y="8" width="22" height="12" rx="1" fill="#cbd5e1"/>
        <rect x="240" y="6" width="22" height="14" rx="1" fill="#ef4444"/>
        <rect x="270" y="7" width="22" height="13" rx="1" fill="#cbd5e1"/>
        <rect x="300" y="7" width="22" height="13" rx="1" fill="#cbd5e1"/>
        <rect x="330" y="8" width="22" height="12" rx="1" fill="#cbd5e1"/>

        <!-- Threshold Reference Line -->
        <line x1="0" y1="2" x2="380" y2="2" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 2" stroke-opacity="0.6"/>
      </g>
    </g>

    <!-- Footer Summary Note -->
    <g transform="translate(0, 535)">
      <text x="0" y="0" class="mono-text" font-size="10" font-weight="500" fill="#94a3b8">INSTITUTIONAL STYLE GUIDELINES INADVERTENTLY TRIGGER DETECTION ALGORITHMS</text>
    </g>
  </g>

  <!-- RIGHT SECTION: Academic Paper & Separated Diagnostic HUD -->
  <g transform="translate(580, 0)">
    
    <!-- Document Base Sheet (Shifted horizontally from X=60 to X=110 to move paper right) -->
    <g transform="translate(110, 75)">
      <rect x="0" y="0" width="380" height="480" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow-soft)"/>
      
      <!-- Academic Paper Header -->
      <rect x="35" y="30" width="160" height="8" rx="2" fill="#0f172a"/>
      <rect x="35" y="44" width="100" height="5" rx="2" fill="#94a3b8"/>
      <line x1="35" y1="60" x2="345" y2="60" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Scanned Area (Strict Bounds: Y=70 to Y=280) -->
      <g transform="translate(35, 70)">
        
        <!-- Column 1 -->
        <g transform="translate(0, 5)">
          <rect x="0" y="0" width="140" height="4" rx="1" fill="#64748b"/>
          <rect x="0" y="8" width="125" height="4" rx="1" fill="#cbd5e1"/>
          <rect x="0" y="16" width="135" height="4" rx="1" fill="#cbd5e1"/>
          <rect x="0" y="24" width="130" height="4" rx="1" fill="#cbd5e1"/>

          <rect x="0" y="40" width="135" height="4" rx="1" fill="#cbd5e1"/>
          <rect x="0" y="48" width="140" height="4" rx="1" fill="#cbd5e1"/>
          <rect x="0" y="56" width="130" height="4" rx="1" fill="#fca5a5"/>
          <rect x="0" y="64" width="120" height="4" rx="1" fill="#cbd5e1"/>

          <!-- Formula Placeholder -->
          <rect x="0" y="80" width="140" height="28" rx="3" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
          <path d="M 20 94 C 30 86, 40 102, 50 94" fill="none" stroke="#0284c7" stroke-width="1.2"/>
          <circle cx="80" cy="94" r="2" fill="#ef4444"/>
          <circle cx="90" cy="94" r="2" fill="#0284c7"/>

          <rect x="0" y="118" width="130" height="4" rx="1" fill="#cbd5e1"/>
          <rect x="0" y="126" width="135" height="4" rx="1" fill="#cbd5e1"/>
          <rect x="0" y="134" width="115" height="4" rx="1" fill="#cbd5e1"/>
        </g>

        <!-- Column 2 -->
        <g transform="translate(160, 5)">
          <rect x="0" y="0" width="135" height="4" rx="1" fill="#cbd5e1"/>
          <rect x="0" y="8" width="130" height="4" rx="1" fill="#cbd5e1"/>
          <rect x="0" y="16" width="140" height="4" rx="1" fill="#fca5a5"/>
          <rect x="0" y="24" width="125" height="4" rx="1" fill="#cbd5e1"/>

          <!-- Figure Placeholder -->
          <rect x="0" y="40" width="140" height="50" rx="3" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
          <circle cx="70" cy="65" r="14" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 2"/>

          <rect x="0" y="100" width="130" height="4" rx="1" fill="#cbd5e1"/>
          <rect x="0" y="108" width="135" height="4" rx="1" fill="#cbd5e1"/>
          <rect x="0" y="116" width="120" height="4" rx="1" fill="#cbd5e1"/>
          <rect x="0" y="124" width="140" height="4" rx="1" fill="#fca5a5"/>
          <rect x="0" y="132" width="110" height="4" rx="1" fill="#cbd5e1"/>
        </g>

        <!-- Scanning Beam: Thicker line stroke-width increased from 1.5 to 3 -->
        <g class="scanner-line">
          <line x1="0" y1="0" x2="310" y2="0" stroke="#ef4444" stroke-width="3" stroke-opacity="0.9"/>
        </g>
      </g>

      <!-- Author Attribution Block -->
      <g transform="translate(35, 272)">
        <line x1="0" y1="0" x2="310" y2="0" stroke="#f1f5f9" stroke-width="1"/>
        <circle cx="10" cy="18" r="8" fill="#e0f2fe"/>
        <path d="M 7 18 L 9 20 L 13 16" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="17" class="title-text" font-size="10" fill="#334155">VERIFIED HUMAN AUTHORSHIP</text>
        <text x="26" y="27" class="mono-text" font-size="8" fill="#94a3b8">STYLE: INSTITUTIONAL HARD SCIENCE</text>
      </g>

      <!-- Stationary Detector Diagnostic HUD Panel (Accelerated animation class) -->
      <g class="alert-box" transform="translate(25, 320)">
        <rect x="0" y="0" width="330" height="130" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" filter="url(#shadow-alert)"/>
        
        <!-- Diagnostic Header -->
        <path d="M 0 6 C 0 2.7, 2.7 0, 6 0 L 324 0 C 327.3 0, 330 2.7, 330 6 L 330 24 L 0 24 Z" fill="#fef2f2"/>
        <line x1="0" y1="24" x2="330" y2="24" stroke="#fee2e2" stroke-width="1"/>
        
        <circle cx="14" cy="12" r="3.5" class="fp-node" fill="#b91c1c"/>
        <text x="24" y="15" class="mono-text" font-size="10" font-weight="700" fill="#b91c1c" letter-spacing="0.5">DETECTOR DIAGNOSTIC: FALSE POSITIVE</text>

        <!-- Structured Diagnostic Content -->
        <g transform="translate(14, 38)">
          <text x="0" y="10" class="mono-text" font-size="9" fill="#64748b">AI CONFIDENCE:</text>
          <text x="95" y="10" class="mono-text" font-size="10" font-weight="700" fill="#b91c1c">98.4%</text>

          <text x="160" y="10" class="mono-text" font-size="9" fill="#64748b">CLASSIFICATION:</text>
          <text x="255" y="10" class="mono-text" font-size="9" font-weight="700" fill="#b91c1c">SYNTHETIC</text>

          <line x1="0" y1="20" x2="302" y2="20" stroke="#f1f5f9" stroke-width="1"/>

          <text x="0" y="36" class="mono-text" font-size="8.5" fill="#334155">• Metric Trigger: Low Perplexity (Standard Vocabulary)</text>
          <text x="0" y="50" class="mono-text" font-size="8.5" fill="#334155">• Metric Trigger: Low Burstiness (Uniform Sentence Length)</text>
          <text x="0" y="64" class="mono-text" font-size="8.5" fill="#0284c7">• Ground Truth: Adherence to Institutional Style Guidelines</text>
        </g>
      </g>
    </g>
  </g>

  <!-- External Frame Border -->
  <rect x="15" y="15" width="1170" height="600" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
</svg>
