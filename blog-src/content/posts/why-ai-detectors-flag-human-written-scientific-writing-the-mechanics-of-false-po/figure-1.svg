<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Diagram showing how Language Model Output and Academic Scientific Manuscript features converge into a Classifier Engine Signal Zone indicating High Probability Synthetic text.">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .label { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .sublabel { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #64748b; text-anchor: middle; }
      .box { fill: #f8fafc; stroke: #cbd5e0; stroke-width: 1.5px; rx: 8px; }
      .box-primary { fill: #f0f5ff; stroke: #2f6fed; stroke-width: 1.5px; rx: 8px; }
      .box-accent { fill: #2f6fed; stroke: #2f6fed; stroke-width: 1.5px; rx: 8px; }
      .text-white { fill: #ffffff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .arrow { stroke: #2f6fed; stroke-width: 1.5px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2f6fed" />
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="820" height="380" />

  <!-- COLUMN 1: Inputs -->
  <!-- Box 1: Language Model Output -->
  <rect class="box-primary" x="40" y="50" width="200" height="110" />
  <text class="title" x="140" y="98" fill="#2f6fed">Language Model</text>
  <text class="title" x="140" y="118" fill="#2f6fed">Output</text>

  <!-- Box 2: Academic Scientific Manuscript -->
  <rect class="box-primary" x="40" y="220" width="200" height="110" />
  <text class="title" x="140" y="260" fill="#2f6fed">Academic Scientific</text>
  <text class="title" x="140" y="280" fill="#2f6fed">Manuscript</text>

  <!-- COLUMN 2: Features -->
  <!-- Feature 1A: Low Perplexity -->
  <rect class="box" x="310" y="40" width="220" height="55" />
  <text class="label" x="420" y="62">Low Perplexity</text>
  <text class="sublabel" x="420" y="78">(Predictable token sequences)</text>

  <!-- Feature 1B: Low Burstiness -->
  <rect class="box" x="310" y="105" width="220" height="55" />
  <text class="label" x="420" y="127">Low Burstiness</text>
  <text class="sublabel" x="420" y="143">(Uniform sentence rhythm)</text>

  <!-- Feature 2A: Discipline Taxonomy -->
  <rect class="box" x="310" y="210" width="220" height="55" />
  <text class="label" x="420" y="235">Discipline Taxonomy</text>

  <!-- Feature 2B: Standardized Passive Formatting -->
  <rect class="box" x="310" y="275" width="220" height="55" />
  <text class="label" x="420" y="300">Standardized Passive Formatting</text>

  <!-- COLUMN 3: Convergence Target -->
  <!-- Box 3: Classifier Engine Signal Zone -->
  <rect class="box" x="590" y="110" width="190" height="160" />
  <text class="label" x="685" y="150">Classifier Engine</text>
  <text class="label" x="685" y="168">Signal Zone</text>
  
  <!-- Sub-box: High Probability Synthetic -->
  <rect class="box-accent" x="605" y="190" width="160" height="60" />
  <text class="text-white" x="685" y="217">High Probability</text>
  <text class="text-white" x="685" y="235">Synthetic</text>

  <!-- ARROWS: Column 1 to Column 2 -->
  <!-- Box 1 to Feature 1A -->
  <path class="arrow" d="M 240 80 L 275 80 L 275 67.5 L 310 67.5" marker-end="url(#arrowhead)" />
  <!-- Box 1 to Feature 1B -->
  <path class="arrow" d="M 240 130 L 275 130 L 275 132.5 L 310 132.5" marker-end="url(#arrowhead)" />

  <!-- Box 2 to Feature 2A -->
  <path class="arrow" d="M 240 250 L 275 250 L 275 237.5 L 310 237.5" marker-end="url(#arrowhead)" />
  <!-- Box 2 to Feature 2B -->
  <path class="arrow" d="M 240 300 L 275 300 L 275 302.5 L 310 302.5" marker-end="url(#arrowhead)" />

  <!-- ARROWS: Column 2 to Column 3 -->
  <!-- Feature 1A to Classifier -->
  <path class="arrow" d="M 530 67.5 L 560 67.5 L 560 150 L 590 150" marker-end="url(#arrowhead)" />
  <!-- Feature 1B to Classifier -->
  <path class="arrow" d="M 530 132.5 L 590 132.5" marker-end="url(#arrowhead)" />
  <!-- Feature 2A to Classifier -->
  <path class="arrow" d="M 530 237.5 L 590 237.5" marker-end="url(#arrowhead)" />
  <!-- Feature 2B to Classifier -->
  <path class="arrow" d="M 530 302.5 L 560 302.5 L 560 220 L 590 220" marker-end="url(#arrowhead)" />
<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>