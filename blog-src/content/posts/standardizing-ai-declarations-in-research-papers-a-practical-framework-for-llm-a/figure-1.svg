<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Syntactic Assistance to Structural Synthesis to Interpretive Logic Generation pipeline diagram">
  <defs>
    <!-- Sleek Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#2f6fed" />
    </marker>
    <!-- Subtle Drop Shadow for Boxes -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a202c" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="820" height="380" fill="#ffffff" />

  <!-- Diagram Header -->
  <text x="60" y="52" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#718096" letter-spacing="1.5">PIPELINE ARCHITECTURE</text>
  <text x="60" y="76" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="800" fill="#1a202c">Translation &amp; Logic Generation Stages</text>

  <!-- ==================== STAGE 1 ==================== -->
  <g filter="url(#shadow)">
    <rect x="60" y="120" width="200" height="150" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5" />
  </g>
  <!-- Stage 1 Pill -->
  <rect x="120" y="138" width="80" height="20" rx="10" fill="#edf3fe" />
  <text x="160" y="152" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="700" fill="#2f6fed" text-anchor="middle" letter-spacing="0.5">STAGE 01</text>
  <!-- Stage 1 Content -->
  <text x="160" y="188" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Syntactic</text>
  <text x="160" y="208" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Assistance</text>
  <text x="160" y="242" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="500" fill="#718096" text-anchor="middle">Lexical &amp; Grammar Validation</text>

  <!-- Connection Arrow 1 -> 2 -->
  <line x1="260" y1="195" x2="302" y2="195" stroke="#2f6fed" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== STAGE 2 ==================== -->
  <g filter="url(#shadow)">
    <rect x="310" y="120" width="200" height="150" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5" />
  </g>
  <!-- Stage 2 Pill -->
  <rect x="370" y="138" width="80" height="20" rx="10" fill="#edf3fe" />
  <text x="410" y="152" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="700" fill="#2f6fed" text-anchor="middle" letter-spacing="0.5">STAGE 02</text>
  <!-- Stage 2 Content -->
  <text x="410" y="188" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Structural</text>
  <text x="410" y="208" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Synthesis</text>
  <text x="410" y="242" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="500" fill="#718096" text-anchor="middle">AST Parsing &amp; Composition</text>

  <!-- Connection Arrow 2 -> 3 -->
  <line x1="510" y1="195" x2="552" y2="195" stroke="#2f6fed" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== STAGE 3 ==================== -->
  <g filter="url(#shadow)">
    <rect x="560" y="120" width="200" height="150" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5" />
  </g>
  <!-- Stage 3 Pill -->
  <rect x="620" y="138" width="80" height="20" rx="10" fill="#edf3fe" />
  <text x="660" y="152" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="700" fill="#2f6fed" text-anchor="middle" letter-spacing="0.5">STAGE 03</text>
  <!-- Stage 3 Content -->
  <text x="660" y="188" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Interpretive</text>
  <text x="660" y="208" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Logic Gen</text>
  <text x="660" y="242" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="500" fill="#718096" text-anchor="middle">Execution Semantics</text>

  <!-- Bottom Informative Caption -->
  <text x="410" y="325" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="500" fill="#a0aec0" text-anchor="middle">Sequential transformation from code structure to executable logic</text>
<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>