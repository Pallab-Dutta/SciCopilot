<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="A flowchart detailing the four-step verification pipeline for auditing LLM-generated manuscripts.">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2f6fed" />
    </marker>
    
    <!-- Drop Shadow for Start/End States -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a202c" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Typography Style -->
  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #1a202c; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #718096; }
    .step-tag { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #a0aec0; letter-spacing: 1px; text-anchor: middle; }
    .step-tag-active { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #2f6fed; letter-spacing: 1px; text-anchor: middle; }
    .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #2d3748; text-anchor: middle; }
    .box-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #718096; text-anchor: middle; }
    .flow-arrow { stroke: #2f6fed; stroke-width: 2; fill: none; stroke-dasharray: 4 2; }
    .flow-arrow-solid { stroke: #2f6fed; stroke-width: 2; fill: none; }
  </style>

  <!-- Header -->
  <g transform="translate(40, 50)">
    <text class="title" x="0" y="0">Scientific Manuscript Auditing Pipeline</text>
    <text class="subtitle" x="0" y="22">Systematic verification workflow for LLM-generated research drafts</text>
  </g>

  <!-- ==================== STEP 1: INPUT ==================== -->
  <g transform="translate(40, 150)">
    <text class="step-tag" x="60" y="-15">START</text>
    <rect width="120" height="90" rx="8" fill="#f8fafc" stroke="#2f6fed" stroke-width="2" filter="url(#shadow)" />
    <!-- Icon Placeholder (Document) -->
    <path d="M 48 22 L 72 22 L 72 42 L 48 42 Z M 54 28 L 66 28 M 54 34 L 66 34" stroke="#2f6fed" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8" />
    <text class="box-title" x="60" y="60">Draft Created</text>
    <text class="box-desc" x="60" y="75">via Raw LLM</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path class="flow-arrow-solid" d="M 160 195 L 191 195" marker-end="url(#arrow)" />

  <!-- ==================== STEP 2: FACT CHECKING ==================== -->
  <g transform="translate(195, 150)">
    <text class="step-tag-active" x="60" y="-15">PHASE 1</text>
    <rect width="120" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5" />
    <!-- Icon Placeholder (Database Search) -->
    <circle cx="56" cy="30" r="7" stroke="#4a5568" stroke-width="1.5" fill="none" />
    <line x1="61" y1="35" x2="68" y2="42" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round" />
    <text class="box-title" x="60" y="60">Fact Checking</text>
    <text class="box-desc" x="60" y="75">against Raw Data</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path class="flow-arrow-solid" d="M 315 195 L 346 195" marker-end="url(#arrow)" />

  <!-- ==================== STEP 3: CITATION LINEAGE ==================== -->
  <g transform="translate(350, 150)">
    <text class="step-tag-active" x="60" y="-15">PHASE 2</text>
    <rect width="120" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5" />
    <!-- Icon Placeholder (Network/Link) -->
    <circle cx="50" cy="36" r="3" fill="#4a5568" />
    <circle cx="70" cy="36" r="3" fill="#4a5568" />
    <circle cx="60" cy="24" r="3" fill="#4a5568" />
    <line x1="50" y1="36" x2="60" y2="24" stroke="#4a5568" stroke-width="1.5" />
    <line x1="70" y1="36" x2="60" y2="24" stroke="#4a5568" stroke-width="1.5" />
    <text class="box-title" x="60" y="60">Citation Check</text>
    <text class="box-desc" x="60" y="75">Lineage Tracking</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path class="flow-arrow-solid" d="M 470 195 L 501 195" marker-end="url(#arrow)" />

  <!-- ==================== STEP 4: LOGIC & MECHANISM ==================== -->
  <g transform="translate(505, 150)">
    <text class="step-tag-active" x="60" y="-15">PHASE 3</text>
    <rect width="120" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5" />
    <!-- Icon Placeholder (Gears/Logic) -->
    <circle cx="55" cy="28" r="5" stroke="#4a5568" stroke-width="1.5" fill="none" />
    <circle cx="66" cy="34" r="5" stroke="#4a5568" stroke-width="1.5" fill="none" />
    <text class="box-title" x="60" y="60">Logic &amp; Mech.</text>
    <text class="box-desc" x="60" y="75">Rigorous Critique</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path class="flow-arrow-solid" d="M 625 195 L 656 195" marker-end="url(#arrow)" />

  <!-- ==================== STEP 5: OUTPUT ==================== -->
  <g transform="translate(660, 150)">
    <text class="step-tag" x="60" y="-15">COMPLETE</text>
    <rect width="120" height="90" rx="8" fill="#f0f9ff" stroke="#2f6fed" stroke-width="2" filter="url(#shadow)" />
    <!-- Icon Placeholder (Verified Shield) -->
    <path d="M 60 20 L 70 24 L 70 33 C 70 39 60 44 60 44 C 60 44 50 39 50 33 L 50 24 Z" fill="#e0f2fe" stroke="#2f6fed" stroke-width="1.5" />
    <path d="M 56 31 L 59 34 L 64 28" stroke="#2f6fed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text class="box-title" x="60" y="60" fill="#1e3a8a">Audited Paper</text>
    <text class="box-desc" x="60" y="75" fill="#3b82f6">Ready for Submission</text>
  </g>

  <!-- Decorative bottom timeline-bar to anchor the flow -->
  <rect x="40" y="300" width="740" height="4" rx="2" fill="#edf2f7" />
  <rect x="160" y="300" width="500" height="4" rx="2" fill="#2f6fed" opacity="0.3" />
  <circle cx="100" cy="302" r="5" fill="#a0aec0" />
  <circle cx="255" cy="302" r="5" fill="#2f6fed" />
  <circle cx="410" cy="302" r="5" fill="#2f6fed" />
  <circle cx="565" cy="302" r="5" fill="#2f6fed" />
  <circle cx="720" cy="302" r="5" fill="#2f6fed" />

<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>