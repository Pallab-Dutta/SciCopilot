<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Diagram showing a researcher cycling between active research projects using literature reviews as a bridge">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f6f8fc; stroke: #cbd5e0; stroke-width: 1.5; rx: 8; }
      .bridge-box { fill: #edf2f7; stroke: #2f6fed; stroke-width: 2; rx: 8; }
      .heading { font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size: 15px; font-weight: 600; fill: #2f6fed; text-anchor: middle; }
      .label { font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size: 12px; fill: #333333; text-anchor: middle; }
      .sublabel { font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size: 10px; fill: #718096; text-anchor: middle; }
      .arrow { fill: none; stroke: #2f6fed; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { fill: none; stroke: #718096; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .head { fill: #2f6fed; }
      .head-gray { fill: #718096; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="head" />
    </marker>
    <marker id="arrowhead-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="head-gray" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" class="bg" />

  <!-- Title -->
  <text x="410" y="45" class="heading">Iterative Research Cycling via Literature Reviews</text>

  <!-- Central Researcher / Core Node -->
  <rect x="340" y="155" width="140" height="70" class="box" />
  <text x="410" y="185" class="label" font-weight="600">Researcher</text>
  <text x="410" y="203" class="sublabel">Active Focus</text>

  <!-- Project A (Left) -->
  <rect x="70" y="155" width="140" height="70" class="box" />
  <text x="140" y="185" class="label" font-weight="600">Project A</text>
  <text x="140" y="203" class="sublabel">Data Collection</text>

  <!-- Project B (Right) -->
  <rect x="610" y="155" width="140" height="70" class="box" />
  <text x="680" y="185" class="label" font-weight="600">Project B</text>
  <text x="680" y="203" class="sublabel">Manuscript Draft</text>

  <!-- Literature Review Bridge (Top Center) -->
  <rect x="340" y="75" width="140" height="55" class="bridge-box" />
  <text x="410" y="98" class="label" font-weight="600" fill="#2f6fed">Literature Review</text>
  <text x="410" y="114" class="sublabel">The Synthesis Bridge</text>

  <!-- Arrows: Projects to Researcher -->
  <path d="M 210,180 L 330,180" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 610,195 L 490,195" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Arrows: Researcher to Literature Review Bridge -->
  <path d="M 390,155 L 390,135" class="arrow" marker-end="url(#arrowhead)" />
  <text x="365" y="148" class="sublabel">synthesize</text>

  <path d="M 430,135 L 430,155" class="arrow" marker-end="url(#arrowhead)" />
  <text x="455" y="148" class="sublabel">apply</text>

  <!-- Cycling / Context Switch Arrows (Bottom loop) -->
  <path d="M 140,225 C 140,280 410,290 410,237" class="arrow-dash" marker-end="url(#arrowhead-gray)" />
  <text x="275" y="275" class="sublabel">Context Switch</text>

  <path d="M 680,225 C 680,280 410,290 410,237" class="arrow-dash" marker-end="url(#arrowhead-gray)" />
  <text x="545" y="275" class="sublabel">Context Switch</text>

<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>