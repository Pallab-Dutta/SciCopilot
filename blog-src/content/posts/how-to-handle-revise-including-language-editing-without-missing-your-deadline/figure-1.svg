<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Flowchart showing manuscript revision bottleneck between reviewer responses and language editing">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f6f8fc; stroke: #cbd5e0; stroke-width: 1.5px; rx: 8px; }
      .accent-box { fill: #eef4ff; stroke: #2f6fed; stroke-width: 2px; rx: 8px; }
      .title { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #1a202c; text-anchor: middle; }
      .label { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; fill: #4a5568; text-anchor: middle; }
      .accent-label { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #2f6fed; text-anchor: middle; }
      .arrow { fill: none; stroke: #2f6fed; stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: #2f6fed; }
      .sub-label { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 10px; fill: #718096; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow-head"/>
    </marker>
  </defs>

  <rect width="820" height="380" class="bg"/>

  <!-- Diagram Title / Header -->
  <text x="410" y="40" class="title" style="font-size: 18px;">The Manuscript Revision &amp; Language Editing Bottleneck</text>

  <!-- Step 1: Editorial Decision -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="140" height="90" class="box"/>
    <text x="70" y="35" class="title">Editorial</text>
    <text x="70" y="53" class="title">Decision</text>
    <text x="70" y="73" class="sub-label">Major Revisions</text>
  </g>

  <!-- Arrow 1 to Fork -->
  <path d="M 180 135 L 230 135" class="arrow" marker-end="url(#arrow)"/>

  <!-- Parallel Branching Container / Background -->
  <rect x="240" y="70" width="340" height="150" fill="#fafbfc" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4" rx="8"/>
  <text x="410" y="92" class="sub-label" style="font-weight: 600; fill: #a0aec0;">MANDATORY PARALLEL TASKS</text>

  <!-- Step 2a: Scientific Revision -->
  <g transform="translate(260, 110)">
    <rect x="0" y="0" width="135" height="90" class="box"/>
    <text x="67.5" y="35" class="title">Scientific</text>
    <text x="67.5" y="53" class="title">Revision</text>
    <text x="67.5" y="73" class="sub-label">Address Reviewers</text>
  </g>

  <!-- Step 2b: Language Polish (The Bottleneck) -->
  <g transform="translate(425, 110)">
    <rect x="0" y="0" width="135" height="90" class="accent-box"/>
    <text x="67.5" y="35" class="title" style="fill: #2f6fed;">Language</text>
    <text x="67.5" y="53" class="title" style="fill: #2f6fed;">Editing</text>
    <text x="67.5" y="73" class="accent-label">Syntax &amp; Clarity</text>
  </g>

  <!-- Arrow from Fork to Merge -->
  <path d="M 580 135 L 630 135" class="arrow" marker-end="url(#arrow)"/>

  <!-- Step 3: Resubmission Deadline -->
  <g transform="translate(640, 90)" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.05))">
    <rect x="0" y="0" width="140" height="90" class="box"/>
    <text x="70" y="35" class="title">Final</text>
    <text x="70" y="53" class="title">Resubmission</text>
    <text x="70" y="73" class="sub-label" style="fill: #e53e3e; font-weight: 600;">Strict Timeline</text>
  </g>

  <!-- Bottom Timeline / Pressure Indicator -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="740" height="60" fill="#fff5f5" stroke="#fed7d7" stroke-width="1.5" rx="8"/>
    <text x="370" y="25" class="title" style="font-size: 13px; fill: #c53030;">The Timeline Squeeze</text>
    <text x="370" y="43" class="sub-label" style="fill: #742a2a;">Language polish delays risk missing the journal's strict resubmission window, threatening rejection.</text>
  </g>

<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>