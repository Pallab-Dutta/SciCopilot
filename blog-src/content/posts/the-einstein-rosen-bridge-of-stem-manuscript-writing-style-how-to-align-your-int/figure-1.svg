<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="The Einstein-Rosen Bridge structural model for STEM papers: an hourglass showing how a broad introduction narrows to specific methods, then expands to broad discussion and impact.">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2f6fed" />
    </marker>
    <!-- Soft shadow for depth -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.05"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    .label-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
    .label-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #2f6fed; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #475569; line-height: 1.4; }
    .glass-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #475569; letter-spacing: 1px; }
    .glass-label-accent { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #2f6fed; letter-spacing: 1px; }
  </style>

  <!-- Background Canvas -->
  <rect width="820" height="380" fill="#ffffff" />

  <!-- Header -->
  <text x="40" y="45" class="title">The Einstein-Rosen Bridge STEM Manuscript Model</text>
  <text x="40" y="65" class="subtitle">An architectural framework mapping narrative scope from global context to localized data, and back to broad impact.</text>

  <!-- ==================== HOURGLASS GRAPHIC (LEFT) ==================== -->
  
  <!-- Upper Funnel (Introduction) -->
  <path d="M 140 95 L 280 95 L 230 175 L 190 175 Z" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Inner lines representing narrowing scope -->
  <line x1="155" y1="115" x2="265" y2="115" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="170" y1="135" x2="250" y2="135" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="182" y1="155" x2="238" y2="155" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2" />
  <text x="210" y="110" text-anchor="middle" class="glass-label">GLOBAL CONTEXT</text>
  <text x="210" y="167" text-anchor="middle" class="glass-label">QUESTION</text>

  <!-- The Neck (Methods & Results) -->
  <rect x="190" y="185" width="40" height="40" rx="4" fill="#eef2ff" stroke="#2f6fed" stroke-width="1.5" />
  <circle cx="210" cy="205" r="3" fill="#2f6fed" />
  <text x="210" y="221" text-anchor="middle" class="glass-label-accent" font-size="8">CORE</text>

  <!-- Lower Funnel (Discussion & Conclusion) -->
  <path d="M 190 235 L 230 235 L 280 315 L 140 315 Z" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Inner lines representing expanding scope -->
  <line x1="182" y1="255" x2="238" y2="255" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="170" y1="275" x2="250" y2="275" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="155" y1="295" x2="265" y2="295" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2" />
  <text x="210" y="250" text-anchor="middle" class="glass-label">FINDINGS</text>
  <text x="210" y="307" text-anchor="middle" class="glass-label">GLOBAL IMPACT</text>

  <!-- ==================== CONNECTORS / ARROWS ==================== -->
  
  <!-- Connector 1 -->
  <path d="M 255 135 H 360" fill="none" stroke="#2f6fed" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  
  <!-- Connector 2 -->
  <path d="M 230 205 H 360" fill="none" stroke="#2f6fed" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  
  <!-- Connector 3 -->
  <path d="M 255 275 H 360" fill="none" stroke="#2f6fed" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)" />

  <!-- ==================== DESCRIPTION CARDS (RIGHT) ==================== -->

  <!-- Card 1: Introduction -->
  <g transform="translate(370, 95)" filter="url(#shadow)">
    <rect width="410" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <path d="M 0 6 L 0 64" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <text x="18" y="22" class="label-sub">Section 1 — Introduction</text>
    <text x="18" y="38" class="label-header">The Contracting Funnel</text>
    <text x="18" y="53" class="body-text">Starts with broad, established context, progressively narrowing down to</text>
    <text x="18" y="65" class="body-text">identify a highly specific gap, hypothesis, or research question.</text>
  </g>

  <!-- Card 2: Methods & Results -->
  <g transform="translate(370, 175)" filter="url(#shadow)">
    <rect width="410" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5" />
    <path d="M 0 6 L 0 64" stroke="#2f6fed" stroke-width="3" stroke-linecap="round" />
    <text x="18" y="22" class="label-sub" fill="#2f6fed">Section 2 — Methods &amp; Results</text>
    <text x="18" y="38" class="label-header">The Narrow Waist</text>
    <text x="18" y="53" class="body-text">The technical core. Highly specific, deeply focused methodology, localized data,</text>
    <text x="18" y="65" class="body-text">and direct experimental findings. No generalization at this stage.</text>
  </g>

  <!-- Card 3: Discussion & Conclusion -->
  <g transform="translate(370, 255)" filter="url(#shadow)">
    <rect width="410" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <path d="M 0 6 L 0 64" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <text x="18" y="22" class="label-sub">Section 3 — Discussion &amp; Outlook</text>
    <text x="18" y="38" class="label-header">The Expanding Funnel</text>
    <text x="18" y="53" class="body-text">Extrapolates findings back out, contextualizing the local results within the</text>
    <text x="18" y="65" class="body-text">wider discipline to show how they transform the broader scientific landscape.</text>
  </g>

<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>