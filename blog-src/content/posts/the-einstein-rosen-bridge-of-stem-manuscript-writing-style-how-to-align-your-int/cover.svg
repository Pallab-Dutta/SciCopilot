<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Academic Parchment Background Gradient -->
    <radialGradient id="ogSpaceBg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#fffdf6" />
      <stop offset="55%" stop-color="#f2ead5" />
      <stop offset="100%" stop-color="#e6dabc" />
    </radialGradient>

    <!-- Mesh Gradient for Central Bridge Body -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4438" stop-opacity="0.22" />
      <stop offset="30%" stop-color="#7c5866" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#9e3d33" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#7c5866" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#4a4438" stop-opacity="0.22" />
    </linearGradient>

    <!-- Core Throat Singularity Glowing Sphere -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffaf0" stop-opacity="1" />
      <stop offset="25%" stop-color="#9e3d33" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#7c5866" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#4a4438" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#4a4438" stop-opacity="0" />
    </radialGradient>

    <!-- Dynamic Flow Energy Stream -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4438" />
      <stop offset="30%" stop-color="#7c5866" />
      <stop offset="50%" stop-color="#1c1a16" />
      <stop offset="70%" stop-color="#9e3d33" />
      <stop offset="100%" stop-color="#4a4438" />
    </linearGradient>

    <!-- Outer Perimeter Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4438" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#7c5866" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#9e3d33" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#7c5866" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4a4438" stop-opacity="0.9" />
    </linearGradient>

    <!-- Enhanced Glow Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Enlarged High-Legibility Typography for Cover Previews */
    .title-main { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; fill: #1c1a16; font-size: 27px; letter-spacing: 3.5px; }
    .title-sub { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; fill: #6b6558; font-size: 14.5px; letter-spacing: 1.5px; }

    .label-phase { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 1.8px; }
    .label-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #1c1a16; }
    .label-desc { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; font-size: 13px; fill: #5c5648; }

    .section-tag { font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 12px; fill: #7c5866; font-weight: 700; letter-spacing: 1.2px; }
    .metric-tag { font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 12px; fill: #9e3d33; font-weight: 700; letter-spacing: 1.2px; }

    /* CSS Keyframe Animations */
    @keyframes pulseRing {
      0%, 100% { stroke-opacity: 0.45; stroke-width: 2.8; }
      50% { stroke-opacity: 1; stroke-width: 4.5; filter: drop-shadow(0 0 10px #4a4438); }
    }

    @keyframes energyFlowDown {
      0% { stroke-dashoffset: 260; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes throatBreath {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.26); opacity: 1; filter: drop-shadow(0 0 22px #9e3d33); }
    }

    @keyframes packetDrop {
      0% { cy: 115; opacity: 0; r: 3.5; }
      15% { opacity: 1; r: 5.5; fill: #4a4438; }
      50% { cy: 315; r: 8.5; fill: #1c1a16; filter: drop-shadow(0 0 12px #9e3d33); }
      85% { opacity: 1; r: 5.5; fill: #4a4438; }
      100% { cy: 515; opacity: 0; r: 3.5; }
    }

    @keyframes ringScan1 {
      0% { transform: scaleX(1) scaleY(1); opacity: 0.45; }
      50% { transform: scaleX(1.04) scaleY(1.12); opacity: 0.95; stroke: #4a4438; stroke-width: 3.5; }
      100% { transform: scaleX(1) scaleY(1); opacity: 0.45; }
    }

    @keyframes ringScan2 {
      0% { transform: scaleX(1) scaleY(1); opacity: 0.45; }
      50% { transform: scaleX(1.07) scaleY(1.15); opacity: 1; stroke: #7c5866; stroke-width: 3.8; }
      100% { transform: scaleX(1) scaleY(1); opacity: 0.45; }
    }

    @keyframes borderPulse {
      0%, 100% { stroke-opacity: 0.7; }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px rgba(74, 68, 56, 0.35)); }
    }

    .pulse-ring-1 { animation: ringScan1 4s ease-in-out infinite; transform-origin: 600px 115px; }
    .pulse-ring-2 { animation: ringScan1 4.5s ease-in-out infinite; transform-origin: 600px 185px; }
    .pulse-ring-3 { animation: ringScan2 3.8s ease-in-out infinite; transform-origin: 600px 255px; }
    .pulse-ring-4 { animation: ringScan2 3.8s ease-in-out infinite; transform-origin: 600px 375px; }
    .pulse-ring-5 { animation: ringScan1 4.5s ease-in-out infinite; transform-origin: 600px 445px; }
    .pulse-ring-6 { animation: ringScan1 4s ease-in-out infinite; transform-origin: 600px 515px; }

    .core-pulse { transform-origin: 600px 315px; animation: throatBreath 2.8s ease-in-out infinite; }
    .stream-fast { stroke-dasharray: 10 14; animation: energyFlowDown 1.7s linear infinite; }
    .stream-medium { stroke-dasharray: 12 18; animation: energyFlowDown 2.6s linear infinite; }

    .quantum-particle-1 { animation: packetDrop 3.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .quantum-particle-2 { animation: packetDrop 3.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; animation-delay: 1.13s; }
    .quantum-particle-3 { animation: packetDrop 3.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; animation-delay: 2.26s; }

    .outer-frame { animation: borderPulse 5s ease-in-out infinite; }
  </style>

  <!-- Base 1200x630 Card Canvas -->
  <rect width="1200" height="630" fill="url(#ogSpaceBg)" />

  <!-- Bold Heavy Outer Double Border -->
  <rect x="15" y="15" width="1170" height="600" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="3" class="outer-frame" />
  <rect x="25" y="25" width="1150" height="580" rx="10" fill="none" stroke="#4a4438" stroke-width="1.8" stroke-opacity="0.3" stroke-dasharray="8 5" />

  <!-- High-Tech Bold Corner Reticles -->
  <g stroke="#4a4438" stroke-width="2.8" fill="none" opacity="0.9">
    <path d="M 12,38 L 38,38 L 38,12" />
    <path d="M 1188,38 L 1162,38 L 1162,12" />
    <path d="M 12,592 L 38,592 L 38,618" />
    <path d="M 1188,592 L 1162,592 L 1162,618" />
  </g>

  <!-- Ambient Astrodynamic Grid Lines -->
  <g opacity="0.1" stroke="#4a4438" stroke-width="1.5">
    <line x1="40" y1="315" x2="1160" y2="315" />
    <line x1="600" y1="35" x2="600" y2="595" />
    <circle cx="600" cy="315" r="210" fill="none" />
  </g>

  <!-- Top Academic Header -->
  <g text-anchor="middle">
    <text x="600" y="55" class="title-main">THE SCHOLARLY EINSTEIN-ROSEN BRIDGE</text>
    <text x="600" y="77" class="title-sub">The Hourglass Geometry of Academic Paper Architecture</text>
  </g>

  <!-- ================= CENTRAL EINSTEIN-ROSEN BRIDGE (Unobstructed at X=600) ================= -->
  <g id="spacetime-funnel">
    <!-- Solid Hull Silhouette Fill -->
    <path d="M 450,115
             C 530,180 560,260 565,315
             C 560,370 530,450 450,515
             L 750,515
             C 670,450 640,370 635,315
             C 640,260 670,180 750,115 Z"
          fill="url(#bridgeGrad)" />

    <!-- Bold Curved Longitudinal Gridlines -->
    <g fill="none" stroke="#4a4438">
      <!-- Outermost Boundary Walls (Extra Bold) -->
      <path d="M 450,115 C 530,180 560,260 565,315 C 560,370 530,450 450,515" stroke-opacity="0.85" stroke-width="3" />
      <path d="M 750,115 C 670,180 640,260 635,315 C 640,370 670,450 750,515" stroke-opacity="0.85" stroke-width="3" />

      <!-- Inner Curvature Streamlines -->
      <path d="M 490,115 C 545,180 570,260 575,315 C 570,370 545,450 490,515" stroke-opacity="0.45" stroke-width="2" />
      <path d="M 525,115 C 560,180 580,260 583,315 C 580,370 560,450 525,515" stroke-opacity="0.35" stroke-width="2" />
      <path d="M 675,115 C 640,180 620,260 617,315 C 620,370 640,450 675,515" stroke-opacity="0.35" stroke-width="2" />
      <path d="M 710,115 C 655,180 630,260 625,315 C 630,370 655,450 710,515" stroke-opacity="0.45" stroke-width="2" />

      <!-- High-Energy Accelerated Streamlines -->
      <path d="M 560,115 C 578,180 590,260 592,315 C 590,370 578,450 560,515"
            stroke="url(#streamGrad)" stroke-width="2.6" class="stream-medium" stroke-opacity="0.9" />
      <path d="M 640,115 C 622,180 610,260 608,315 C 610,370 622,450 640,515"
            stroke="url(#streamGrad)" stroke-width="2.6" class="stream-medium" stroke-opacity="0.9" />

      <!-- Central Singularity Core Stream -->
      <path d="M 600,115 L 600,515"
            stroke="#1c1a16" stroke-width="3" class="stream-fast" filter="url(#glow)" stroke-opacity="0.95" />
    </g>

    <!-- Transverse Section Contour Rings (Bold & Animated) -->
    <!-- 1. Top Wide Mouth -->
    <ellipse cx="600" cy="115" rx="150" ry="19" fill="none" stroke="#4a4438" stroke-width="3" class="pulse-ring-1" />

    <!-- 2. Mid Funnel Inward -->
    <ellipse cx="600" cy="185" rx="100" ry="14" fill="none" stroke="#4a4438" stroke-width="2.6" class="pulse-ring-2" />

    <!-- 3. Lower Apex into Paper Core -->
    <ellipse cx="600" cy="255" rx="60" ry="9" fill="none" stroke="#7c5866" stroke-width="2.8" class="pulse-ring-3" />

    <!-- 4. The Bridge Singularity / Central Neck -->
    <ellipse cx="600" cy="315" rx="55" ry="24" fill="url(#coreGlow)" class="core-pulse" />
    <ellipse cx="600" cy="315" rx="35" ry="7" fill="none" stroke="#9e3d33" stroke-width="4" filter="url(#intenseGlow)" />

    <!-- 5. Flaring Exit into Initial Findings -->
    <ellipse cx="600" cy="375" rx="60" ry="9" fill="none" stroke="#7c5866" stroke-width="2.8" class="pulse-ring-4" />

    <!-- 6. Expanding Macro Context -->
    <ellipse cx="600" cy="445" rx="100" ry="14" fill="none" stroke="#4a4438" stroke-width="2.6" class="pulse-ring-5" />

    <!-- 7. Base Cosmological Horizon -->
    <ellipse cx="600" cy="515" rx="150" ry="19" fill="none" stroke="#4a4438" stroke-width="3" class="pulse-ring-6" />
  </g>

  <!-- Animated Quantum Energy Packets -->
  <circle cx="600" cy="0" r="5" class="quantum-particle-1" />
  <circle cx="600" cy="0" r="5" class="quantum-particle-2" />
  <circle cx="600" cy="0" r="5" class="quantum-particle-3" />

  <!-- ================= LEFT SIDE: PUSHED TO MARGIN (X <= 400) ================= -->
  <g>
    <!-- Upper Funnel Macro Bracket -->
    <path d="M 405,115 L 385,115 L 385,255 L 405,255" fill="none" stroke="#4a4438" stroke-width="2.6" />
    <line x1="385" y1="185" x2="365" y2="185" stroke="#4a4438" stroke-width="2.6" />
    <text x="350" y="177" text-anchor="end" class="label-phase" fill="#4a4438">I. INTRODUCTION</text>
    <text x="350" y="198" text-anchor="end" class="label-desc">Funneling Inward: From the big picture... (Zone I)</text>

    <!-- Throat / Singularity Core Callout -->
    <line x1="565" y1="315" x2="385" y2="315" stroke="#9e3d33" stroke-width="2.6" stroke-dasharray="6 4" filter="url(#glow)" />
    <circle cx="565" cy="315" r="5.5" fill="#9e3d33" filter="url(#glow)"/>
    <text x="365" y="297" text-anchor="end" class="metric-tag">THE SINGULARITY (THE THROAT)</text>
    <text x="365" y="319" text-anchor="end" class="label-title" fill="#9e3d33">II. THE PAPER CORE</text>
    <text x="365" y="340" text-anchor="end" class="label-desc">Direct Method, Concrete Data &amp; Experiments</text>

    <!-- Lower Funnel Macro Bracket -->
    <path d="M 405,375 L 385,375 L 385,515 L 405,515" fill="none" stroke="#4a4438" stroke-width="2.6" />
    <line x1="385" y1="445" x2="365" y2="445" stroke="#4a4438" stroke-width="2.6" />
    <text x="350" y="437" text-anchor="end" class="label-phase" fill="#4a4438">III. DISCUSSION &amp; CONCLUSION</text>
    <text x="350" y="458" text-anchor="end" class="label-desc">Flaring Outward: Back to the bigger picture... (Zone II)</text>
  </g>

  <!-- ================= RIGHT SIDE: PUSHED TO MARGIN (X >= 790) ================= -->

  <!-- Zone 1: Broad Topic Overview -->
  <g>
    <path d="M 750,115 L 790,115" fill="none" stroke="#4a4438" stroke-width="2.4" stroke-dasharray="4 3"/>
    <circle cx="750" cy="115" r="5" fill="#4a4438"/>
    <text x="805" y="105" class="section-tag">ZONE 1: UPPER EVENT HORIZON</text>
    <text x="805" y="126" class="label-title">Broad Topic Overview</text>
    <text x="805" y="146" class="label-desc">Global relevance, universal context, macro domain.</text>
  </g>

  <!-- Zone 2: Convergent Gravitational Pull / Research Gap -->
  <g>
    <path d="M 700,185 L 790,185" fill="none" stroke="#4a4438" stroke-width="2.4" stroke-dasharray="4 3"/>
    <circle cx="700" cy="185" r="5" fill="#4a4438"/>
    <text x="805" y="175" class="section-tag">CONVERGENT GRAVITATIONAL PULL</text>
    <text x="805" y="196" class="label-title">Prior Work &amp; Research Gap</text>
    <text x="805" y="216" class="label-desc">Known limitations, unaddressed conflicts &amp; bottlenecks.</text>
  </g>

  <!-- Zone 3: Entry Vector / Contribution -->
  <g>
    <path d="M 660,255 L 790,255" fill="none" stroke="#7c5866" stroke-width="2.4" stroke-dasharray="4 3"/>
    <circle cx="660" cy="255" r="5" fill="#7c5866"/>
    <text x="805" y="245" class="section-tag">ENTRY VECTOR</text>
    <text x="805" y="266" class="label-title">Paper Purpose &amp; Hypothesis</text>
    <text x="805" y="286" class="label-desc">Explicit aim, unique scope &amp; direct technical formulation.</text>
  </g>

  <!-- Zone 4: Immediate Findings -->
  <g>
    <path d="M 660,375 L 790,375" fill="none" stroke="#7c5866" stroke-width="2.4" stroke-dasharray="4 3"/>
    <circle cx="660" cy="375" r="5" fill="#7c5866"/>
    <text x="805" y="365" class="section-tag">EXIT VECTOR: LOWER EVENT HORIZON</text>
    <text x="805" y="386" class="label-title">Immediate Empirical Findings</text>
    <text x="805" y="406" class="label-desc">Interpretation of results, resolving the initial research gap.</text>
  </g>

  <!-- Zone 5: Divergent Dispersion / Impact -->
  <g>
    <path d="M 700,445 L 790,445" fill="none" stroke="#4a4438" stroke-width="2.4" stroke-dasharray="4 3"/>
    <circle cx="700" cy="445" r="5" fill="#4a4438"/>
    <text x="805" y="435" class="section-tag">DIVERGENT DISPERSION</text>
    <text x="805" y="456" class="label-title">Implications &amp; Value</text>
    <text x="805" y="476" class="label-desc">Cross-domain implications, systemic and theoretical value.</text>
  </g>

  <!-- Zone 6: Future Horizons -->
  <g>
    <path d="M 750,515 L 790,515" fill="none" stroke="#4a4438" stroke-width="2.4" stroke-dasharray="4 3"/>
    <circle cx="750" cy="515" r="5" fill="#4a4438"/>
    <text x="805" y="505" class="section-tag">ZONE 2: LOWER EVENT HORIZON</text>
    <text x="805" y="526" class="label-title">Broader Impact &amp; Open Questions</text>
    <text x="805" y="546" class="label-desc">Unsolved mysteries, next-generation research roadmaps.</text>
  </g>

  <!-- Bottom Academic Citation / Axiom -->
  <g text-anchor="middle">
    <text x="600" y="590" class="label-desc" font-style="italic" fill="#6b6558" font-size="13px">
      "A research paper takes readers from the known universe, compresses through the singularity of original proof, and expands into a new horizon."
    </text>
  </g>
</svg>
