<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Three levels of manuscript editing: substantive editing, copyediting, and proofreading as the final gate before submission">
  <defs>
    <marker id="ah1" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f6fed"/>
    </marker>
  </defs>
  <rect width="820" height="380" fill="#ffffff"/>
  <text x="40" y="56" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="800" fill="#1a1a1a">Three levels of manuscript editing</text>
  <text x="40" y="84" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#64748b">Each works on a different layer, in order.</text>

  <!-- Substantive editing -->
  <rect x="40" y="150" width="212" height="100" rx="10" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="146" y="192" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="700" fill="#333333">Substantive editing</text>
  <text x="146" y="216" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#64748b">structure and argument</text>

  <!-- Copyediting -->
  <rect x="304" y="150" width="212" height="100" rx="10" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="410" y="192" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="700" fill="#333333">Copyediting</text>
  <text x="410" y="216" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#64748b">grammar, style, clarity</text>

  <!-- Proofreading (final gate, accented) -->
  <rect x="568" y="150" width="212" height="100" rx="10" fill="#eef4ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="674" y="192" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="800" fill="#2f6fed">Proofreading</text>
  <text x="674" y="216" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#475569">final surface errors</text>
  <text x="674" y="288" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" fill="#2f6fed">the last gate before submission</text>

  <line x1="256" y1="200" x2="300" y2="200" stroke="#2f6fed" stroke-width="2" marker-end="url(#ah1)"/>
  <line x1="520" y1="200" x2="564" y2="200" stroke="#2f6fed" stroke-width="2" marker-end="url(#ah1)"/>
<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>
