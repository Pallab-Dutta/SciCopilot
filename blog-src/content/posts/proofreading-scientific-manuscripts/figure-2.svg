<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="What a scientific proofreading pass checks: language and grammar; units, symbols and equations; terminology and notation; references and citations; figures, tables and captions">
  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2f6fed"/>
    </marker>
  </defs>
  <rect width="820" height="380" fill="#ffffff"/>
  <text x="40" y="44" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="800" fill="#1a1a1a">What a scientific proofreading pass checks</text>

  <!-- Hub -->
  <rect x="40" y="156" width="176" height="96" rx="10" fill="#eef4ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="128" y="198" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15.5" font-weight="800" fill="#2f6fed">Proofreading</text>
  <text x="128" y="220" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15.5" font-weight="800" fill="#2f6fed">pass</text>

  <!-- Five checks -->
  <rect x="300" y="64" width="480" height="50" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="316" y="86" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13.5" font-weight="700" fill="#333333">Language and grammar</text>
  <text x="316" y="104" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#64748b">spelling, tense, articles, clarity</text>

  <rect x="300" y="126" width="480" height="50" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="316" y="148" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13.5" font-weight="700" fill="#333333">Units, symbols and equations</text>
  <text x="316" y="166" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#64748b">SI units, signs, exponents, operators</text>

  <rect x="300" y="188" width="480" height="50" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="316" y="210" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13.5" font-weight="700" fill="#333333">Terminology and notation</text>
  <text x="316" y="228" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#64748b">one symbol per quantity, defined once</text>

  <rect x="300" y="250" width="480" height="50" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="316" y="272" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13.5" font-weight="700" fill="#333333">References and citations</text>
  <text x="316" y="290" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#64748b">every citation matched, style consistent</text>

  <rect x="300" y="312" width="480" height="50" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="316" y="334" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13.5" font-weight="700" fill="#333333">Figures, tables and captions</text>
  <text x="316" y="352" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#64748b">called out, numbered, labels carry units</text>

  <line x1="216" y1="204" x2="296" y2="89"  stroke="#2f6fed" stroke-width="1.6" marker-end="url(#ah2)"/>
  <line x1="216" y1="204" x2="296" y2="151" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#ah2)"/>
  <line x1="216" y1="204" x2="296" y2="213" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#ah2)"/>
  <line x1="216" y1="204" x2="296" y2="275" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#ah2)"/>
  <line x1="216" y1="204" x2="296" y2="337" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#ah2)"/>
<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>
