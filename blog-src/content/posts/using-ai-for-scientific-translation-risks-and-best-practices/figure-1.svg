<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Flowchart showing the verification bottleneck in AI translation">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2f6fed"/>
    </marker>
    
    <!-- Drop shadow for clean depth -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" fill="#ffffff"/>

  <!-- TITLE / CAPTION -->
  <text x="410" y="45" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="600" fill="#1a202c" text-anchor="middle">The Verification Bottleneck in AI Translation</text>
  
  <!-- FLOW STEPS (3 main horizontal boxes + 1 final output box) -->

  <!-- Box 1: AI Paraphrase -->
  <g transform="translate(48, 110)">
    <rect width="156" height="150" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="156" height="36" rx="8" fill="#edf2f7"/>
    <rect x="0" y="24" width="156" height="12" fill="#edf2f7"/>
    <text x="78" y="23" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#2f6fed" text-anchor="middle">Step 1</text>
    
    <text x="78" y="72" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#333333" text-anchor="middle">AI Suggestion</text>
    <text x="78" y="92" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#718096" text-anchor="middle">Sounds fluent</text>
    <text x="78" y="112" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#718096" text-anchor="middle">and native</text>
  </g>

  <!-- Connector 1 -->
  <line x1="204" y1="185" x2="236" y2="185" stroke="#2f6fed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: Subtle Alteration -->
  <g transform="translate(240, 110)">
    <rect width="156" height="150" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="156" height="36" rx="8" fill="#edf2f7"/>
    <rect x="0" y="24" width="156" height="12" fill="#edf2f7"/>
    <text x="78" y="23" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#2f6fed" text-anchor="middle">Step 2</text>
    
    <text x="78" y="72" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#333333" text-anchor="middle">Alters Technical</text>
    <text x="78" y="92" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#333333" text-anchor="middle">Nuance &amp; Logic</text>
    <text x="78" y="120" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#e53e3e" text-anchor="middle">Lacks explanations</text>
  </g>

  <!-- Connector 2 -->
  <line x1="396" y1="185" x2="428" y2="185" stroke="#2f6fed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: Verification Bottleneck -->
  <g transform="translate(432, 110)">
    <rect width="156" height="150" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="156" height="36" rx="8" fill="#edf2f7"/>
    <rect x="0" y="24" width="156" height="12" fill="#edf2f7"/>
    <text x="78" y="23" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#2f6fed" text-anchor="middle">Step 3</text>
    
    <text x="78" y="72" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#333333" text-anchor="middle">User Struggles</text>
    <text x="78" y="92" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#333333" text-anchor="middle">to Evaluate</text>
    <text x="78" y="120" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#718096" text-anchor="middle">Hidden shift</text>
  </g>

  <!-- Connector 3 -->
  <line x1="588" y1="185" x2="620" y2="185" stroke="#2f6fed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 4: Risk / Outcome -->
  <g transform="translate(624, 110)">
    <rect width="148" height="150" rx="8" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="148" height="36" rx="8" fill="#fed7d7"/>
    <rect x="0" y="24" width="148" height="12" fill="#fed7d7"/>
    <text x="74" y="23" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#c53030" text-anchor="middle">Result</text>
    
    <text x="74" y="72" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="500" fill="#9b2c2c" text-anchor="middle">Indefensible</text>
    <text x="74" y="92" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="500" fill="#9b2c2c" text-anchor="middle">Paper</text>
    <text x="74" y="120" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#c53030" text-anchor="middle">Polished nonsense</text>
  </g>

  <!-- FOOTER NOTE -->
  <text x="410" y="315" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#718096" text-anchor="middle">Non-native authors risk submitting logically flawed text because polished AI outputs mask deep domain shifts.</text>
<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>