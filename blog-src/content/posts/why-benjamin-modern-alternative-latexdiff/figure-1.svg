<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="LaTeX equation diff compilation error diagram">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #1a1a1a; }
      .label { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; fill: #333333; }
      .code { font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace; font-size: 11px; fill: #2d3748; }
      .box { fill: #f6f8fc; stroke: #cbd5e0; stroke-width: 1.5; rx: 8; }
      .error-box { fill: #fff5f5; stroke: #feb2b2; stroke-width: 1.5; rx: 8; }
      .arrow { stroke: #1a1a1a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash-arrow { stroke: #e53e3e; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#red-arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#e53e3e"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Diagram Title / Header -->
  <text x="410" y="40" text-anchor="middle" class="title">LaTeX Equation Block Split by Diff Algorithm</text>

  <!-- Box 1: Original LaTeX Block -->
  <g transform="translate(40, 70)">
    <rect width="220" height="110" class="box"/>
    <text x="20" y="30" class="title" style="font-size:13px;">Original Equation</text>
    <text x="20" y="55" class="code">\begin{equation}</text>
    <text x="20" y="75" class="code">  E = mc^2 + \int_{0}^{\infty}</text>
    <text x="20" y="95" class="code">\end{equation}</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 275 125 L 325 125" class="arrow"/>
  <text x="300" y="115" text-anchor="middle" class="label" style="font-size:10px;">git diff</text>

  <!-- Box 2: Split by Diff -->
  <g transform="translate(340, 70)">
    <rect width="140" height="110" class="box"/>
    <text x="70" y="30" text-anchor="middle" class="title" style="font-size:13px;">Diff Split</text>
    <text x="20" y="60" class="code" fill="#e53e3e">- \begin{equation}</text>
    <text x="20" y="85" class="code" fill="#3182ce">+ \begin{align}</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 495 125 L 545 125" class="arrow"/>
  <text x="520" y="115" text-anchor="middle" class="label" style="font-size:10px;">compile</text>

  <!-- Box 3: Compilation Error -->
  <g transform="translate(560, 70)">
    <rect width="220" height="110" class="error-box"/>
    <text x="20" y="30" class="title" style="font-size:13px; fill:#e53e3e;">Compilation Error</text>
    <text x="20" y="55" class="code" fill="#c53030">! LaTeX Error: \begin{equation}</text>
    <text x="20" y="75" class="code" fill="#c53030">  ended by \end{align}.</text>
    <text x="20" y="95" class="label" fill="#e53e3e" style="font-size:10px;">Mismatched environment tags</text>
  </g>

  <!-- Bottom Flow: Resolution / Correct State -->
  <g transform="translate(340, 225)">
    <rect width="440" height="100" class="box" style="fill:#f0fff4; stroke:#9ae6b4;"/>
    <text x="25" y="30" class="title" style="font-size:13px; fill:#2f855a;">Corrected Output (Matched Pairs)</text>
    <text x="25" y="55" class="code">\begin{align}</text>
    <text x="25" y="75" class="code">  E &amp;= mc^2 + \int_{0}^{\infty} \dots</text>
    <text x="240" y="55" class="code">\end{align}</text>
  </g>

  <!-- Feedback Arrow from Error to Resolution -->
  <path d="M 670 185 C 670 205, 560 205, 560 220" class="dash-arrow"/>
  <text x="635" y="202" text-anchor="middle" class="label" style="font-size:10px; fill:#e53e3e;">fix delimiters</text>

<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>