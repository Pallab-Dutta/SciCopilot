<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Four-step progression from observation to relationship building">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #2f6fed; }
      .label { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: #333333; text-anchor: middle; dominant-baseline: middle; }
      .step-num { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #2f6fed; text-anchor: middle; dominant-baseline: middle; }
      .box { fill: #f6f8fc; stroke: #cbd5e0; stroke-width: 1.5; rx: 8; }
      .arrow { stroke: #2f6fed; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f6fed" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" fill="#ffffff" />

  <!-- Diagram Title / Header -->
  <text x="50" y="55" class="title">From Observation to Relationship Building</text>

  <!-- Step 1 -->
  <g transform="translate(50, 95)">
    <rect x="0" y="0" width="150" height="200" class="box" />
    <circle cx="75" cy="35" r="14" fill="#ebf3ff" />
    <text x="75" y="35" class="step-num">01</text>
    <text x="75" y="110" class="label">Careful</text>
    <text x="75" y="130" class="label">Observation</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 210 195 L 254 195" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 2 -->
  <g transform="translate(260, 95)">
    <rect x="0" y="0" width="150" height="200" class="box" />
    <circle cx="75" cy="35" r="14" fill="#ebf3ff" />
    <text x="75" y="35" class="step-num">02</text>
    <text x="75" y="110" class="label">Pattern</text>
    <text x="75" y="130" class="label">Recognition</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 420 195 L 464 195" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 3 -->
  <g transform="translate(470, 95)">
    <rect x="0" y="0" width="150" height="200" class="box" />
    <circle cx="75" cy="35" r="14" fill="#ebf3ff" />
    <text x="75" y="35" class="step-num">03</text>
    <text x="75" y="110" class="label">Active</text>
    <text x="75" y="130" class="label">Engagement</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 630 195 L 674 195" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 4 -->
  <g transform="translate(680, 95)">
    <rect x="0" y="0" width="150" height="200" class="box" />
    <circle cx="75" cy="35" r="14" fill="#ebf3ff" />
    <text x="75" y="35" class="step-num">04</text>
    <text x="75" y="110" class="label">Trust &amp;</text>
    <text x="75" y="130" class="label">Relationship</text>
  </g>

<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>