<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Venn diagram showing a dissertation candidate at the intersection of specialist committee domains">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .box-desc { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .circle-label { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      .candidate-label { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #2f6fed; }
      .card { fill: #f8fafc; stroke: #cbd5e0; stroke-width: 1.5px; rx: 8px; }
      .card-accent { fill: #eff6ff; stroke: #2f6fed; stroke-width: 1.5px; rx: 8px; }
      .arrow { stroke: #94a3b8; stroke-width: 1.5px; fill: none; stroke-linejoin: round; }
      .arrow-accent { stroke: #2f6fed; stroke-width: 1.5px; fill: none; stroke-dasharray: 4 3; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowhead-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2f6fed" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" fill="#ffffff" />

  <!-- Header -->
  <text x="410" y="34" class="title" text-anchor="middle">DISSERTATION CANDIDATE KNOWLEDGE INTERSECTION</text>
  <text x="410" y="52" class="subtitle" text-anchor="middle">Positioning unique doctoral research at the convergence of committee expertise</text>

  <!-- Venn Circles (Center X: 410, Y: 215) -->
  <g id="venn-diagram">
    <!-- Domain A: Top Left -->
    <circle cx="360" cy="180" r="90" fill="#f1f5f9" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Domain B: Top Right -->
    <circle cx="460" cy="180" r="90" fill="#f1f5f9" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Domain C: Bottom Center -->
    <circle cx="410" cy="250" r="90" fill="#f1f5f9" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Center Intersection Highlight -->
    <path d="M 410 160 A 90 90 0 0 1 450 220 A 90 90 0 0 1 370 220 A 90 90 0 0 1 410 160 Z" fill="#2f6fed" fill-opacity="0.15" stroke="#2f6fed" stroke-width="1.5" />
    <circle cx="410" cy="202" r="5" fill="#2f6fed" />
  </g>

  <!-- Domain Labels inside Circles (non-overlapping regions) -->
  <text x="330" y="150" class="circle-label" text-anchor="middle">Methodology</text>
  <text x="490" y="150" class="circle-label" text-anchor="middle">Theoretical Framework</text>
  <text x="410" y="305" class="circle-label" text-anchor="middle">Substantive Domain</text>

  <!-- Left Side Cards -->
  <!-- Box 1: Specialist 1 -->
  <rect x="36" y="100" width="190" height="70" class="card" />
  <text x="48" y="124" class="box-title">Methodologist</text>
  <text x="48" y="142" class="box-desc">Advanced Quantitative &amp;</text>
  <text x="48" y="156" class="box-desc">Analytical Models</text>

  <!-- Box 2: Specialist 3 -->
  <rect x="36" y="235" width="190" height="70" class="card" />
  <text x="48" y="259" class="box-title">Domain Expert</text>
  <text x="48" y="277" class="box-desc">Applied Context &amp;</text>
  <text x="48" y="291" class="box-desc">Empirical Grounding</text>

  <!-- Right Side Cards -->
  <!-- Box 3: Specialist 2 -->
  <rect x="594" y="100" width="190" height="70" class="card" />
  <text x="606" y="124" class="box-title">Theory Specialist</text>
  <text x="606" y="142" class="box-desc">Conceptual Foundations &amp;</text>
  <text x="606" y="156" class="box-desc">Literature Canon</text>

  <!-- Box 4: Candidate (Highlighted) -->
  <rect x="594" y="235" width="190" height="75" class="card-accent" />
  <text x="606" y="258" class="box-title" fill="#2f6fed">Dissertation Candidate</text>
  <text x="606" y="276" class="candidate-label">Unique Synthesis</text>
  <text x="606" y="292" class="box-desc">Novel contribution at the</text>
  <text x="606" y="304" class="box-desc">exact intersection</text>

  <!-- Connecting Arrows -->
  <!-- Box 1 -> Domain A -->
  <path d="M 226 135 L 285 135" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Box 2 -> Domain C -->
  <path d="M 226 270 L 325 270" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Box 3 -> Domain B -->
  <path d="M 594 135 L 535 135" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Box 4 (Candidate) -> Center Intersection -->
  <path d="M 594 272 L 515 272 L 515 202 L 423 202" class="arrow-accent" marker-end="url(#arrowhead-accent)" />
<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>