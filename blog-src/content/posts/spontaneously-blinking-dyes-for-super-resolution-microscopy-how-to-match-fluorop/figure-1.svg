<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Comparison of High vs Tuned Low On:Off Ratios in Super-Resolution Fluorescence Microscopy">
  <defs>
    <style>
      .title { font: bold 13px system-ui, -apple-system, sans-serif; fill: #1e293b; letter-spacing: 0.5px; text-transform: uppercase; }
      .subtitle { font: 12px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .panel-hdr { font: bold 15px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .panel-sub { font: 13px system-ui, -apple-system, sans-serif; fill: #2f6fed; font-weight: 500; }
      .panel-sub-alt { font: 13px system-ui, -apple-system, sans-serif; fill: #64748b; font-weight: 500; }
      .label-bold { font: bold 12px system-ui, -apple-system, sans-serif; }
      .label-muted { font: 12px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .desc-text { font: 12px system-ui, -apple-system, sans-serif; fill: #334155; }
    </style>

    <!-- Radial Gradients for Point Spread Functions (PSFs) -->
    <radialGradient id="psf-yellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#facc15" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#fef08a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="psf-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#93c5fd" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>

    <!-- Marker for dashed alignment line -->
    <marker id="dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6">
      <circle cx="3" cy="3" r="1.5" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" fill="#ffffff"/>

  <!-- Main Canvas Outline / Margin area -->
  <text x="32" y="32" class="title">Fluorophore On:Off Ratio &amp; Photoswitching Density</text>

  <!-- ================= LEFT PANEL: HIGH ON:OFF RATIO ================= -->
  <g transform="translate(32, 48)">
    <!-- Card Container -->
    <rect width="364" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Panel Header -->
    <text x="20" y="28" class="panel-hdr">High On:Off Ratio</text>
    <text x="20" y="46" class="panel-sub-alt">e.g., Conventional HM-SiR</text>

    <!-- Status Badge -->
    <rect x="236" y="16" width="108" height="22" rx="11" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="290" y="31" class="label-bold" fill="#991b1b" text-anchor="middle">Many "On" Dyes</text>

    <!-- Microtubule / Filament Backbone -->
    <g transform="translate(0, 10)">
      <!-- Base Structure (Tubulin/Filament Strand) -->
      <path d="M 30,130 Q 110,120 182,130 T 334,130" fill="none" stroke="#cbd5e0" stroke-width="14" stroke-linecap="round"/>
      <path d="M 30,130 Q 110,120 182,130 T 334,130" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

      <!-- Overlapping PSFs (Dense Activation) -->
      <circle cx="65" cy="126" r="38" fill="url(#psf-yellow)"/>
      <circle cx="105" cy="122" r="38" fill="url(#psf-yellow)"/>
      <circle cx="145" cy="124" r="38" fill="url(#psf-yellow)"/>
      <circle cx="185" cy="130" r="38" fill="url(#psf-yellow)"/>
      <circle cx="225" cy="128" r="38" fill="url(#psf-yellow)"/>
      <circle cx="265" cy="126" r="38" fill="url(#psf-yellow)"/>
      <circle cx="300" cy="130" r="38" fill="url(#psf-yellow)"/>

      <!-- Fluorophore Emitter Cores (Active Dyes) -->
      <circle cx="65" cy="126" r="4" fill="#a16207" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="105" cy="122" r="4" fill="#a16207" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="145" cy="124" r="4" fill="#a16207" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="185" cy="130" r="4" fill="#a16207" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="225" cy="128" r="4" fill="#a16207" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="265" cy="126" r="4" fill="#a16207" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="300" cy="130" r="4" fill="#a16207" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Overlap Envelope Line -->
      <path d="M 30,86 Q 182,75 334,88 Q 334,170 182,172 Q 30,168 30,86 Z" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
    </g>

    <!-- Bottom Result Box -->
    <rect x="16" y="208" width="332" height="76" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
    <path d="M 16,208 L 16,284" stroke="#dc2626" stroke-width="4" stroke-linecap="square"/>
    <text x="32" y="230" class="label-bold" fill="#991b1b">Result: Unresolvable Spatial Blur</text>
    <text x="32" y="248" class="desc-text">Simultaneous emission causes Point Spread</text>
    <text x="32" y="264" class="desc-text">Functions (PSFs) to overlap continuously.</text>
  </g>

  <!-- ================= RIGHT PANEL: TUNED LOW ON:OFF RATIO ================= -->
  <g transform="translate(424, 48)">
    <!-- Card Container -->
    <rect width="364" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Panel Header -->
    <text x="20" y="28" class="panel-hdr">Tuned Low On:Off Ratio</text>
    <text x="20" y="46" class="panel-sub">e.g., JF-b Dyes</text>

    <!-- Status Badge -->
    <rect x="232" y="16" width="112" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="288" y="31" class="label-bold" fill="#1e40af" text-anchor="middle">Sparse "On" Dyes</text>

    <!-- Microtubule / Filament Backbone -->
    <g transform="translate(0, 10)">
      <!-- Base Structure (Tubulin/Filament Strand) -->
      <path d="M 30,130 Q 110,120 182,130 T 334,130" fill="none" stroke="#cbd5e0" stroke-width="14" stroke-linecap="round"/>
      <path d="M 30,130 Q 110,120 182,130 T 334,130" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

      <!-- Inactive / "Off" State Fluorophores (Dashed / Dim Circles) -->
      <circle cx="65" cy="126" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2"/>
      <circle cx="105" cy="122" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2"/>
      <circle cx="185" cy="130" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2"/>
      <circle cx="225" cy="128" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2"/>
      <circle cx="265" cy="126" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2"/>

      <!-- Active "On" State PSFs (Isolated Signals) -->
      <circle cx="145" cy="124" r="32" fill="url(#psf-blue)"/>
      <circle cx="300" cy="130" r="32" fill="url(#psf-blue)"/>

      <!-- Fluorophore Emitter Cores (Active Dyes) -->
      <circle cx="145" cy="124" r="4" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="300" cy="130" r="4" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Localization Crosshairs for Precision -->
      <path d="M 145,114 L 145,134 M 135,124 L 155,124" stroke="#2f6fed" stroke-width="1" stroke-opacity="0.6"/>
      <path d="M 300,120 L 300,140 M 290,130 L 310,130" stroke="#2f6fed" stroke-width="1" stroke-opacity="0.6"/>
    </g>

    <!-- Bottom Result Box -->
    <rect x="16" y="208" width="332" height="76" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <path d="M 16,208 L 16,284" stroke="#2f6fed" stroke-width="4" stroke-linecap="square"/>
    <text x="32" y="230" class="label-bold" fill="#1e40af">Result: High-Precision Single-Molecule Fit</text>
    <text x="32" y="248" class="desc-text">Majority of dyes stay dark ("off"). Well-separated</text>
    <text x="32" y="264" class="desc-text">PSFs allow exact center-position localization.</text>
  </g>
</svg>