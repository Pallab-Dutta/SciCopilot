<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Darkfield Insets for Microscopy Views -->
    <radialGradient id="darkfield-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Point Spread Function Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-magenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Spectrum Bar Gradient -->
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#e63946" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#1e293b" />
    </marker>
    <marker id="arrow-magenta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#e63946" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#00b4d8" />
    </marker>

    <!-- Styles for Animations -->
    <style>
      /* Microstructure Path */
      .structure-base {
        stroke: #1e293b;
        stroke-width: 6;
        stroke-linecap: round;
        fill: none;
      }
      .structure-active {
        stroke: #00b4d8;
        stroke-width: 1.5;
        stroke-dasharray: 4 4;
        fill: none;
        opacity: 0.6;
      }

      /* High On-Ratio Fluorophores (Overlapping) */
      .dye-high {
        fill: #e63946;
        filter: url(#glow-magenta);
        animation: blink-high 1.2s infinite ease-in-out alternate;
      }
      .dye-high-alt {
        fill: #e63946;
        filter: url(#glow-magenta);
        animation: blink-high 1.6s infinite ease-in-out alternate-reverse;
      }

      @keyframes blink-high {
        0% { opacity: 0.4; transform: scale(0.85); }
        100% { opacity: 1; transform: scale(1.25); }
      }

      /* Matched Kinetics (Sparse Blinking) */
      .dye-matched-1 { animation: blink-sparse-1 2.5s infinite; }
      .dye-matched-2 { animation: blink-sparse-2 3.2s infinite; }
      .dye-matched-3 { animation: blink-sparse-3 2.8s infinite; }
      .dye-matched-4 { animation: blink-sparse-4 2.1s infinite; }

      @keyframes blink-sparse-1 {
        0%, 15% { opacity: 1; transform: scale(1.2); fill: #00b4d8; filter: url(#glow-cyan); }
        22%, 100% { opacity: 0.15; transform: scale(0.7); fill: #334155; filter: none; }
      }
      @keyframes blink-sparse-2 {
        0%, 30% { opacity: 0.15; transform: scale(0.7); fill: #334155; filter: none; }
        35%, 50% { opacity: 1; transform: scale(1.2); fill: #00b4d8; filter: url(#glow-cyan); }
        57%, 100% { opacity: 0.15; transform: scale(0.7); fill: #334155; filter: none; }
      }
      @keyframes blink-sparse-3 {
        0%, 55% { opacity: 0.15; transform: scale(0.7); fill: #334155; filter: none; }
        60%, 75% { opacity: 1; transform: scale(1.2); fill: #00b4d8; filter: url(#glow-cyan); }
        82%, 100% { opacity: 0.15; transform: scale(0.7); fill: #334155; filter: none; }
      }
      @keyframes blink-sparse-4 {
        0%, 75% { opacity: 0.15; transform: scale(0.7); fill: #334155; filter: none; }
        80%, 95% { opacity: 1; transform: scale(1.2); fill: #7b2cbf; filter: url(#glow-magenta); }
        100% { opacity: 0.15; transform: scale(0.7); fill: #334155; filter: none; }
      }

      /* Target Fitting Animation */
      .fit-target {
        stroke: #00b4d8;
        stroke-width: 1;
        fill: none;
        opacity: 0;
        animation: target-fit 2.5s infinite;
      }
      @keyframes target-fit {
        0%, 12% { opacity: 0; transform: scale(2); }
        15% { opacity: 1; transform: scale(1); }
        20% { opacity: 1; }
        25%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Clean Academic Grid Background -->
  <g stroke="#e2e8f0" stroke-width="0.5" opacity="0.7">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300 M 0,360 L 1200,360 M 0,420 L 1200,420 M 0,480 L 1200,480 M 0,540 L 1200,540" />
    <path d="M 100,0 L 100,630 M 200,0 L 200,630 M 300,0 L 300,630 M 400,0 L 400,630 M 500,0 L 500,630 M 600,0 L 600,630 M 700,0 L 700,630 M 800,0 L 800,630 M 900,0 L 900,630 M 1000,0 L 1000,630 M 1100,0 L 1100,630" />
  </g>

  <!-- Panel A: Unmatched Kinetics (High On:Off Ratio) -->
  <g transform="translate(60, 80)">
    <!-- Darkfield Microscope Window -->
    <rect x="0" y="0" width="320" height="320" rx="6" fill="url(#darkfield-bg)" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Microstructure -->
    <path d="M 40,260 Q 120,160 170,140 T 280,50" class="structure-base" />

    <!-- Overlapping Emissions (PSF Error) -->
    <circle cx="70" cy="225" r="22" class="dye-high" />
    <circle cx="95" cy="195" r="26" class="dye-high-alt" />
    <circle cx="115" cy="180" r="24" class="dye-high" />
    <circle cx="155" cy="150" r="28" class="dye-high-alt" />
    <circle cx="185" cy="130" r="22" class="dye-high" />
    <circle cx="230" cy="85" r="25" class="dye-high-alt" />
    <circle cx="250" cy="65" r="20" class="dye-high" />

    <!-- Label Overlay -->
    <rect x="10" y="10" width="130" height="24" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1" />
    <text x="18" y="26" fill="#e63946" font-size="11" font-weight="700">HIGH ON:OFF RATIO</text>

    <!-- Error Tag -->
    <rect x="90" y="280" width="140" height="26" rx="4" fill="#ef4444" />
    <text x="160" y="297" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PSF OVERLAP ERROR</text>

    <!-- Panel Title Below -->
    <text x="160" y="355" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">a. Unmatched Kinetics (HM-SiR)</text>
  </g>

  <!-- Panel B: Tuned Kinetics (Sparse Blinking & SMLM Precision) -->
  <g transform="translate(440, 80)">
    <!-- Darkfield Microscope Window -->
    <rect x="0" y="0" width="320" height="320" rx="6" fill="url(#darkfield-bg)" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Microstructure -->
    <path d="M 40,260 Q 120,160 170,140 T 280,50" class="structure-base" />
    <path d="M 40,260 Q 120,160 170,140 T 280,50" class="structure-active" />

    <!-- Inactive Dark-State Dyes -->
    <circle cx="50" cy="250" r="3" fill="#334155" />
    <circle cx="95" cy="195" r="3" fill="#334155" />
    <circle cx="140" cy="160" r="3" fill="#334155" />
    <circle cx="200" cy="115" r="3" fill="#334155" />
    <circle cx="260" cy="55" r="3" fill="#334155" />

    <!-- Sparsely Blinking Dyes -->
    <g transform="translate(70, 225)">
      <circle cx="0" cy="0" r="7" class="dye-matched-1" />
      <path d="M -12,0 L 12,0 M 0,-12 L 0,12" class="fit-target" />
    </g>
    <g transform="translate(115, 180)">
      <circle cx="0" cy="0" r="7" class="dye-matched-2" />
      <path d="M -12,0 L 12,0 M 0,-12 L 0,12" style="animation: target-fit 3.2s infinite; animation-delay: 1.1s;" class="fit-target" />
    </g>
    <g transform="translate(170, 140)">
      <circle cx="0" cy="0" r="7" class="dye-matched-3" />
    </g>
    <g transform="translate(230, 85)">
      <circle cx="0" cy="0" r="7" class="dye-matched-4" />
    </g>

    <!-- Accumulated Super-Resolution Localizations -->
    <g opacity="0.8">
      <circle cx="50" cy="250" r="1.5" fill="#00b4d8" />
      <circle cx="95" cy="195" r="1.5" fill="#00b4d8" />
      <circle cx="140" cy="160" r="1.5" fill="#00b4d8" />
      <circle cx="200" cy="115" r="1.5" fill="#00b4d8" />
      <circle cx="260" cy="55" r="1.5" fill="#00b4d8" />
    </g>

    <!-- Label Overlay -->
    <rect x="10" y="10" width="130" height="24" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1" />
    <text x="18" y="26" fill="#00b4d8" font-size="11" font-weight="700">OPTIMIZED KINETICS</text>

    <!-- Success Tag -->
    <rect x="90" y="280" width="140" height="26" rx="4" fill="#00b4d8" />
    <text x="160" y="297" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">SMLM RESOLVED</text>

    <!-- Panel Title Below -->
    <text x="160" y="355" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">b. Tuned Kinetics (JF Dyes)</text>
  </g>

  <!-- Panel C: Chemical Equilibrium Scheme & Dynamic Range -->
  <g transform="translate(820, 80)">
    <rect x="0" y="0" width="320" height="320" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

    <text x="20" y="35" fill="#0f172a" font-size="12" font-weight="700">SPONTANEOUS BLINKING EQUILIBRIUM</text>

    <!-- Reaction Scheme -->
    <g transform="translate(20, 70)">
      <!-- OFF State -->
      <rect x="0" y="0" width="85" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
      <text x="42" y="22" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">OFF</text>
      <text x="42" y="38" fill="#64748b" font-size="9" text-anchor="middle">(Dark)</text>

      <!-- Arrows -->
      <path d="M 95,17 L 180,17" stroke="#00b4d8" stroke-width="2" marker-end="url(#arrow-cyan)" />
      <text x="137" y="12" fill="#00b4d8" font-size="9" font-weight="700" text-anchor="middle">k_on</text>

      <path d="M 180,33 L 95,33" stroke="#e63946" stroke-width="2" marker-end="url(#arrow-magenta)" />
      <text x="137" y="46" fill="#e63946" font-size="9" font-weight="700" text-anchor="middle">k_off</text>

      <!-- ON State -->
      <rect x="190" y="0" width="85" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
      <text x="232" y="22" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">ON</text>
      <text x="232" y="38" fill="#64748b" font-size="9" text-anchor="middle">(Bright)</text>
    </g>

    <!-- Chemical Tuning Spectrum -->
    <g transform="translate(20, 160)">
      <text x="0" y="0" fill="#0f172a" font-size="11" font-weight="700">ON:OFF RATIO DYNAMIC RANGE</text>
      <text x="0" y="16" fill="#64748b" font-size="10">>2 Orders of Magnitude</text>

      <!-- Gradient Bar -->
      <rect x="0" y="30" width="280" height="12" rx="6" fill="url(#spectrum)" />

      <!-- Position Indicators -->
      <circle cx="30" cy="36" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
      <path d="M 30,46 L 30,65" stroke="#1e293b" stroke-width="1" />
      <text x="30" y="77" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">SOFI</text>

      <circle cx="140" cy="36" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
      <path d="M 140,46 L 140,65" stroke="#1e293b" stroke-width="1" />
      <text x="140" y="77" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Dense SMLM</text>

      <circle cx="250" cy="36" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
      <path d="M 250,46 L 250,65" stroke="#1e293b" stroke-width="1" />
      <text x="250" y="77" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">HM-SiR</text>
    </g>

    <!-- Panel Title Below -->
    <text x="160" y="355" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">c. Kinetic Tuning Mechanism</text>
  </g>

  <!-- Summary Legend / Data Bar -->
  <g transform="translate(60, 480)">
    <rect x="0" y="0" width="1080" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    
    <g transform="translate(40, 28)">
      <circle cx="12" cy="12" r="8" fill="#e63946" />
      <text x="30" y="16" fill="#0f172a" font-size="12" font-weight="700">High On:Off Ratio:</text>
      <text x="150" y="16" fill="#475569" font-size="12">Causes emitter overlap &amp; localization error in dense samples</text>
    </g>

    <g transform="translate(40, 52)">
      <circle cx="12" cy="12" r="8" fill="#00b4d8" />
      <text x="30" y="16" fill="#0f172a" font-size="12" font-weight="700">Tuned Kinetics:</text>
      <text x="150" y="16" fill="#475569" font-size="12">Enables precise single-molecule localization without phototoxic UV lasers</text>
    </g>
  </g>
</svg>
