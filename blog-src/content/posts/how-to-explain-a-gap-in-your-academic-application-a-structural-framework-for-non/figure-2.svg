<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <style>
    .title { font-size: 24px; font-weight: 700; fill: #111827; letter-spacing: 0.5px; }
    .subtitle { font-size: 14px; fill: #4b5563; font-weight: 400; }
    .section-header { font-size: 13px; font-weight: 700; fill: #6b7280; letter-spacing: 1.5px; text-transform: uppercase; }
    
    .card-title { font-size: 16px; font-weight: 600; fill: #111827; }
    .card-subtitle { font-size: 12px; font-weight: 500; }
    .card-desc { font-size: 13px; fill: #1f2937; line-height: 1.5; }
    
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; fill: white; }
    .strategy-title { font-size: 15px; font-weight: 600; fill: #111827; }
    .strategy-desc { font-size: 12px; fill: #4b5563; }
    
    .box-rect { fill: #f9fafb; stroke: #e5e7eb; }
    .risk-outcome-desc { fill: #1f2937; }
  </style>

  <defs>
    <!-- Card Gradients (not strictly necessary with plain background, but here to maintain structure) -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    
    <!-- (Glow Filter removed as it looks poor on white) -->
  </defs>

  <!-- BACKGROUND -->
  <rect width="900" height="680" fill="#ffffff" />
  <!-- (Background decorations removed for clean white) -->

  <!-- HEADER SECTION -->
  <g transform="translate(50, 45)">
    <text class="title" x="0" y="0">Candidate Dossier Risk Assessment Framework</text>
    <text class="subtitle" x="0" y="24">How admissions committees evaluate qualifications vs. potential operational risks</text>
  </g>

  <!-- SECTION 1: CORE OPERATIONAL CRITERIA -->
  <g transform="translate(50, 110)">
    <text class="section-header" x="0" y="0">1. Core Selection Criteria</text>
    
    <!-- Criterion 1: Technical Foundation -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="250" height="180" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" />
      <rect x="0" y="0" width="250" height="4" rx="2" fill="#2563eb" />
      <circle cx="35" cy="35" r="16" fill="#bfdbfe" />
      <!-- Icon: Code / Math -->
      <path d="M 30 35 L 25 30 M 30 35 L 25 40 M 40 35 L 45 30 M 40 35 L 45 40" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text class="card-title" x="62" y="35">Technical</text>
      <text class="card-subtitle" x="62" y="49" fill="#1d4ed8">FOUNDATION</text>
      
      <text class="card-desc" x="20" y="85">
        <tspan x="20" dy="0">Evaluates quantitative,</tspan>
        <tspan x="20" dy="18">methodological, and</tspan>
        <tspan x="20" dy="18">domain knowledge to</tspan>
        <tspan x="20" dy="18">execute proposed work.</tspan>
      </text>
    </g>

    <!-- Criterion 2: Project Execution -->
    <g transform="translate(275, 15)">
      <rect x="0" y="0" width="250" height="180" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" />
      <rect x="0" y="0" width="250" height="4" rx="2" fill="#16a34a" />
      <circle cx="35" cy="35" r="16" fill="#bbf7d0" />
      <!-- Icon: Gear / Execution -->
      <path d="M 35 27 L 35 43 M 27 35 L 43 35 M 29 29 L 41 41 M 29 41 L 41 29" stroke="#15803d" stroke-width="2" stroke-linecap="round" />
      <text class="card-title" x="62" y="35">Project</text>
      <text class="card-subtitle" x="62" y="49" fill="#15803d">EXECUTION</text>
      
      <text class="card-desc" x="20" y="85">
        <tspan x="20" dy="0">Measures self-direction</tspan>
        <tspan x="20" dy="18">and resilience to manage</tspan>
        <tspan x="20" dy="18">long-term experiments</tspan>
        <tspan x="20" dy="18">&amp; unexpected hurdles.</tspan>
      </text>
    </g>

    <!-- Criterion 3: Trajectory Alignment -->
    <g transform="translate(550, 15)">
      <rect x="0" y="0" width="250" height="180" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" />
      <rect x="0" y="0" width="250" height="4" rx="2" fill="#9333ea" />
      <circle cx="35" cy="35" r="16" fill="#e9d5ff" />
      <!-- Icon: Arrow / Trajectory -->
      <path d="M 27 41 L 43 27 M 43 27 H 33 M 43 27 V 37" stroke="#7e22ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text class="card-title" x="62" y="35">Trajectory</text>
      <text class="card-subtitle" x="62" y="49" fill="#7e22ce">ALIGNMENT</text>
      
      <text class="card-desc" x="20" y="85">
        <tspan x="20" dy="0">Assesses logical fit</tspan>
        <tspan x="20" dy="18">between the program/lab</tspan>
        <tspan x="20" dy="18">and candidate's overall</tspan>
        <tspan x="20" dy="18">professional goals.</tspan>
      </text>
    </g>
  </g>

  <!-- SECTION 2: THE GAP HANDLING SPECTRUM -->
  <g transform="translate(50, 345)">
    <text class="section-header" x="0" y="0">2. Evaluation Spectrum: Addressing Application Gaps</text>
    
    <!-- Background Track -->
    <rect x="0" y="25" width="800" height="190" rx="16" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" />
    
    <!-- Spectrum Line -->
    <defs>
      <linearGradient id="spectrum-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ef4444" />
        <stop offset="50%" stop-color="#10b981" />
        <stop offset="100%" stop-color="#f59e0b" />
      </linearGradient>
    </defs>
    <rect x="30" y="45" width="740" height="6" rx="3" fill="url(#spectrum-grad)" />

    <!-- Left Pitfall: Unaddressed Gap -->
    <g transform="translate(30, 65)">
      <circle cx="15" cy="15" r="14" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
      <text x="15" y="19" class="badge-text" fill="white">!</text>
      
      <text class="strategy-title" x="40" y="15" fill="#b91c1c">Unaddressed Gap</text>
      <text class="strategy-desc" x="40" y="32">Leaves an informational void</text>

      <rect x="0" y="50" width="220" height="75" rx="8" class="box-rect" stroke="#b91c1c" stroke-width="1" />
      <text x="15" y="70" font-size="11" fill="#b91c1c" font-weight="600">Evaluator Risk:</text>
      <text x="15" y="88" font-size="12" class="risk-outcome-desc">Fills void with worst-case</text>
      <text x="15" y="104" font-size="12" class="risk-outcome-desc">assumptions on competence.</text>
    </g>

    <!-- Optimal Zone: Professional Risk Frame -->
    <g transform="translate(290, 65)">
      <circle cx="15" cy="15" r="14" fill="#10b981" stroke="#047857" stroke-width="1.5" />
      <path d="M 10 15 L 14 19 L 20 11" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      <text class="strategy-title" x="40" y="15" fill="#047857">Calibrated Continuity</text>
      <text class="strategy-desc" x="40" y="32">Objective &amp; capability-focused</text>

      <rect x="0" y="50" width="220" height="75" rx="8" class="box-rect" stroke="#047857" stroke-width="1" />
      <text x="15" y="70" font-size="11" fill="#047857" font-weight="600">Optimal Outcome:</text>
      <text x="15" y="88" font-size="12" class="risk-outcome-desc">Reassures continuity and</text>
      <text x="15" y="104" font-size="12" class="risk-outcome-desc">readiness for research.</text>
    </g>

    <!-- Right Pitfall: Excessive Detail -->
    <g transform="translate(550, 65)">
      <circle cx="15" cy="15" r="14" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
      <text x="15" y="19" class="badge-text" fill="white">!</text>
      
      <text class="strategy-title" x="40" y="15" fill="#b45309">Excessive Personal Detail</text>
      <text class="strategy-desc" x="40" y="32">Over-explaining past crisis</text>

      <rect x="0" y="50" width="220" height="75" rx="8" class="box-rect" stroke="#b45309" stroke-width="1" />
      <text x="15" y="70" font-size="11" fill="#b45309" font-weight="600">Evaluator Risk:</text>
      <text x="15" y="88" font-size="12" class="risk-outcome-desc">Diverts focus away from</text>
      <text x="15" y="104" font-size="12" class="risk-outcome-desc">present research capabilities.</text>
    </g>
  </g>

  <!-- TAKEAWAY FOOTER -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="800" height="50" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" />
    <text x="25" y="30" font-size="13" fill="#4b5563">Key Takeaway:</text>
    <text x="125" y="30" font-size="13" fill="#111827" font-weight="500">Address gaps by framing them through <tspan fill="#2563eb">operational capability</tspan> rather than personal justification.</text>
  </g>

</svg>
