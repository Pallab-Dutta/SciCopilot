<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <style>
    .main-title { font-size: 22px; font-weight: 700; fill: #0f172a; font-family: Georgia, serif; }
    .subtitle { font-size: 13px; fill: #475569; font-style: italic; font-family: Georgia, serif; }
    .section-label { font-size: 11px; font-weight: 700; fill: #1e3a8a; letter-spacing: 1.5px; text-transform: uppercase; }
    
    .card-title { font-size: 16px; font-weight: 700; fill: #0f172a; font-family: Georgia, serif; }
    .card-subtitle { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .card-body { font-size: 12px; fill: #334155; line-height: 1.5; }
    
    .example-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .example-text { font-size: 11px; fill: #334155; font-style: italic; line-height: 1.4; }
  </style>

  <!-- BACKGROUND -->
  <rect width="900" height="680" fill="#ffffff" />
  
  <!-- HEADER SECTION -->
  <g transform="translate(50, 45)">
    <text class="main-title" x="0" y="0">The Tripartite Gap Communication Framework</text>
    <text class="subtitle" x="0" y="22">A structured methodology for articulating non-linear academic trajectories</text>
    <line x1="0" y1="36" x2="800" y2="36" stroke="#cbd5e1" stroke-width="1" />
  </g>

  <!-- PROCESS FLOW ARROWS (BACKGROUND) -->
  <g transform="translate(50, 150)">
    <!-- Arrow 1 to 2 -->
    <path d="M 255 110 L 270 110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)" />
    <!-- Arrow 2 to 3 -->
    <path d="M 530 110 L 545 110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <defs>
      <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
        <polygon points="0 0, 8 4, 0 8" fill="#64748b" />
      </marker>
    </defs>
  </g>

  <!-- THREE COLUMNS FRAMEWORK -->
  <g transform="translate(50, 110)">
    <text class="section-label" x="0" y="0">Sequential Communication Model</text>
    
    <!-- STAGE 1: STATE -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="245" height="420" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <rect x="0" y="0" width="245" height="5" fill="#b91c1c" />
      
      <!-- Stage Badge -->
      <rect x="20" y="20" width="24" height="24" rx="12" fill="#fee2e2" />
      <text x="32" y="36" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">1</text>
      
      <text class="card-title" x="54" y="30">1. State</text>
      <text class="card-subtitle" x="54" y="43" fill="#b91c1c">Brief &amp; Objective</text>
      <line x1="20" y1="58" x2="225" y2="58" stroke="#e2e8f0" stroke-width="1" />
      
      <!-- Core Principles -->
      <text class="card-body" x="20" y="80">
        <tspan x="20" dy="0" font-weight="600" fill="#0f172a">• Acknowledge Boundary:</tspan>
        <tspan x="30" dy="18">State the timing/presence</tspan>
        <tspan x="30" dy="16">in a single neutral sentence.</tspan>
        
        <tspan x="20" dy="24" font-weight="600" fill="#0f172a">• Maintain Privacy:</tspan>
        <tspan x="30" dy="18">Private or medical details</tspan>
        <tspan x="30" dy="16">are not required.</tspan>
        
        <tspan x="20" dy="24" font-weight="600" fill="#0f172a">• Objective Focus:</tspan>
        <tspan x="30" dy="18">Provide factual boundaries</tspan>
        <tspan x="30" dy="16">without personal defense.</tspan>
      </text>

      <!-- Example Box -->
      <g transform="translate(15, 275)">
        <rect x="0" y="0" width="215" height="130" rx="4" fill="#fff1f2" stroke="#fecaca" stroke-width="1" />
        <text class="example-title" x="12" y="20" fill="#991b1b">Example Statement</text>
        <line x1="12" y1="28" x2="203" y2="28" stroke="#fca5a5" stroke-width="1" />
        <text class="example-text" x="12" y="46">
          <tspan x="12" dy="0">"Between Sept 2022 and</tspan>
          <tspan x="12" dy="16">Aug 2023, I took a formal</tspan>
          <tspan x="12" dy="16">leave of absence from</tspan>
          <tspan x="12" dy="16">academic coursework to</tspan>
          <tspan x="12" dy="16">manage a personal medical</tspan>
          <tspan x="12" dy="16">condition."</tspan>
        </text>
      </g>
    </g>

    <!-- STAGE 2: TRANSITION -->
    <g transform="translate(277, 20)">
      <rect x="0" y="0" width="245" height="420" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <rect x="0" y="0" width="245" height="5" fill="#15803d" />
      
      <!-- Stage Badge -->
      <rect x="20" y="20" width="24" height="24" rx="12" fill="#dcfce7" />
      <text x="32" y="36" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">2</text>
      
      <text class="card-title" x="54" y="30">2. Transition</text>
      <text class="card-subtitle" x="54" y="43" fill="#15803d">Continuity &amp; Resolution</text>
      <line x1="20" y1="58" x2="225" y2="58" stroke="#e2e8f0" stroke-width="1" />
      
      <!-- Core Principles -->
      <text class="card-body" x="20" y="80">
        <tspan x="20" dy="0" font-weight="600" fill="#0f172a">• Demonstrate Stability:</tspan>
        <tspan x="30" dy="18">Confirm the issue is</tspan>
        <tspan x="30" dy="16">resolved or fully managed.</tspan>
        
        <tspan x="20" dy="24" font-weight="600" fill="#0f172a">• Maintain Readiness:</tspan>
        <tspan x="30" dy="18">Highlight active skill</tspan>
        <tspan x="30" dy="16">preservation or coursework.</tspan>
        
        <tspan x="20" dy="24" font-weight="600" fill="#0f172a">• Intellectual Engagement:</tspan>
        <tspan x="30" dy="18">Note literature review,</tspan>
        <tspan x="30" dy="16">up-skilling, or baseline work.</tspan>
      </text>

      <!-- Example Box -->
      <g transform="translate(15, 275)">
        <rect x="0" y="0" width="215" height="130" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
        <text class="example-title" x="12" y="20" fill="#166534">Example Statement</text>
        <line x1="12" y1="28" x2="203" y2="28" stroke="#86efac" stroke-width="1" />
        <text class="example-text" x="12" y="46">
          <tspan x="12" dy="0">"During this period, I</tspan>
          <tspan x="12" dy="16">maintained quantitative</tspan>
          <tspan x="12" dy="16">readiness by completing</tspan>
          <tspan x="12" dy="16">coursework in statistical</tspan>
          <tspan x="12" dy="16">computing and reading</tspan>
          <tspan x="12" dy="16">recent literature."</tspan>
        </text>
      </g>
    </g>

    <!-- STAGE 3: SIGNAL -->
    <g transform="translate(555, 20)">
      <rect x="0" y="0" width="245" height="420" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <rect x="0" y="0" width="245" height="5" fill="#1e3a8a" />
      
      <!-- Stage Badge -->
      <rect x="20" y="20" width="24" height="24" rx="12" fill="#dbeafe" />
      <text x="32" y="36" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">3</text>
      
      <text class="card-title" x="54" y="30">3. Signal</text>
      <text class="card-subtitle" x="54" y="43" fill="#1e3a8a">Current Research Readiness</text>
      <line x1="20" y1="58" x2="225" y2="58" stroke="#e2e8f0" stroke-width="1" />
      
      <!-- Core Principles -->
      <text class="card-body" x="20" y="80">
        <tspan x="20" dy="0" font-weight="600" fill="#0f172a">• Connect Operational Status:</tspan>
        <tspan x="30" dy="18">Directly link current capacity</tspan>
        <tspan x="30" dy="16">to target program needs.</tspan>
        
        <tspan x="20" dy="24" font-weight="600" fill="#0f172a">• Align Deliverables:</tspan>
        <tspan x="30" dy="18">Show how skills apply to</tspan>
        <tspan x="30" dy="16">upcoming lab projects.</tspan>
        
        <tspan x="20" dy="24" font-weight="600" fill="#0f172a">• Pivot to Future:</tspan>
        <tspan x="30" dy="18">Re-anchor evaluator focus</tspan>
        <tspan x="30" dy="16">on immediate contribution.</tspan>
      </text>

      <!-- Example Box -->
      <g transform="translate(15, 275)">
        <rect x="0" y="0" width="215" height="130" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
        <text class="example-title" x="12" y="20" fill="#1e40af">Example Statement</text>
        <line x1="12" y1="28" x2="203" y2="28" stroke="#93c5fd" stroke-width="1" />
        <text class="example-text" x="12" y="46">
          <tspan x="12" dy="0">"With this health issue</tspan>
          <tspan x="12" dy="16">resolved, I am prepared</tspan>
          <tspan x="12" dy="16">to apply these computational</tspan>
          <tspan x="12" dy="16">skills to genomic dataset</tspan>
          <tspan x="12" dy="16">analysis in your group's</tspan>
          <tspan x="12" dy="16">current project."</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- SUMMARY FOOTER -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="800" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="20" y="26" font-size="12" fill="#0f172a" font-weight="700" font-family="Georgia, serif">Strategic Formula:</text>
    <text x="145" y="26" font-size="12" fill="#334155">Acknowledge Gap (State) <tspan font-weight="700">→</tspan> Prove Baseline Continuity (Transition) <tspan font-weight="700">→</tspan> Re-anchor on Value Add (Signal)</text>
  </g>

</svg>
