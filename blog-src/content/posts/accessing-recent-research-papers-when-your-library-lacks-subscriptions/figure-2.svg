<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Green Open Access sharing flow: shows transition from submission through peer review to either a paywalled publisher version or a legally sharable author accepted manuscript." style="background-color: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrow marker for neutral paths -->
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#718096" />
    </marker>
    <!-- Arrow marker for active/accent paths -->
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2f6fed" />
    </marker>
  </defs>

  <!-- Diagram Title -->
  <text x="40" y="40" font-size="16" font-weight="700" fill="#1a202c">Green Open Access: Peer-to-Peer Sharing Flow</text>
  <text x="40" y="58" font-size="12" fill="#718096">How authors legally share Accepted Manuscripts (AAM) directly with readers</text>

  <!-- ====== NODE 1: SUBMISSION ====== -->
  <g transform="translate(40, 155)">
    <rect width="110" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5" />
    <text x="55" y="30" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle">1. Author</text>
    <text x="55" y="48" font-size="12" fill="#1a202c" text-anchor="middle">Submits Paper</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 150 190 L 190 190" fill="none" stroke="#718096" stroke-width="1.5" marker-end="url(#arrow-neutral)" />

  <!-- ====== NODE 2: PEER REVIEW ====== -->
  <g transform="translate(190, 155)">
    <rect width="120" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5" />
    <text x="60" y="30" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle">2. Peer Review</text>
    <text x="60" y="48" font-size="12" fill="#1a202c" text-anchor="middle">&amp; Acceptance</text>
  </g>

  <!-- Split Path: B -> C1 (Top) & C2 (Bottom) -->
  <!-- We route a single line out, then branch it vertically -->
  <path d="M 310 190 L 330 190" fill="none" stroke="#718096" stroke-width="1.5" />
  
  <!-- Branch Up to Publisher VoR -->
  <path d="M 330 190 L 330 95 L 350 95" fill="none" stroke="#718096" stroke-width="1.5" marker-end="url(#arrow-neutral)" />
  
  <!-- Branch Down to Author AAM (Accent Path) -->
  <path d="M 330 190 L 330 285 L 350 285" fill="none" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow-accent)" />

  <!-- ====== NODE 3a: PUBLISHER VOR (PAYWALLED) ====== -->
  <g transform="translate(350, 60)">
    <rect width="130" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="65" y="30" font-size="12" font-weight="600" fill="#a0aec0" text-anchor="middle">Publisher VoR</text>
    <text x="65" y="48" font-size="11" fill="#a0aec0" text-anchor="middle">(Paywalled / Gold)</text>
  </g>

  <!-- ====== NODE 3b: AUTHOR AAM (SHARABLE) ====== -->
  <g transform="translate(350, 250)">
    <rect width="130" height="70" rx="8" fill="#f0f4ff" stroke="#2f6fed" stroke-width="1.5" />
    <text x="65" y="30" font-size="12" font-weight="600" fill="#2f6fed" text-anchor="middle">Author AAM</text>
    <text x="65" y="48" font-size="11" fill="#4a5568" text-anchor="middle">(Accepted MS - Free)</text>
  </g>

  <!-- Arrow C2 -> D -->
  <path d="M 480 285 L 520 285" fill="none" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow-accent)" />

  <!-- ====== NODE 4: READER REQUESTS ====== -->
  <g transform="translate(520, 250)">
    <rect width="120" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5" />
    <text x="60" y="30" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle">3. Reader</text>
    <text x="60" y="48" font-size="12" fill="#1a202c" text-anchor="middle">Requests Copy</text>
  </g>

  <!-- Arrow D -> E -->
  <path d="M 640 285 L 680 285" fill="none" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow-accent)" />

  <!-- ====== NODE 5: P2P SHARE (LEGAL) ====== -->
  <g transform="translate(680, 250)">
    <rect width="100" height="70" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
    <text x="50" y="30" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">4. P2P Share</text>
    <text x="50" y="48" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">100% Legal</text>
  </g>

  <!-- Contextual Label for the AAM fork -->
  <text x="340" y="235" font-size="11" font-weight="600" fill="#2f6fed" text-anchor="start">Green OA Route</text>
<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>