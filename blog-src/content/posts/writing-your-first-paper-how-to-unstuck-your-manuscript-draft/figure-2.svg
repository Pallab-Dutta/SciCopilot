<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Statistical Blocker Diagnostic Flowchart">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .label-main { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
      .label-q1 { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: #475569; }
      .label-q2 { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .label-out-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #2f6fed; }
      .label-out-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #475569; }
      .edge-label-neutral { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; }
      .edge-label-accent { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #2f6fed; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2f6fed" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" fill="#ffffff" />

  <!-- Header -->
  <text x="60" y="45" class="title">STATISTICAL BLOCKER TAXONOMY</text>
  <text x="60" y="66" class="subtitle">Diagnostic flow for identifying analytical and technical friction</text>

  <!-- Root Node -->
  <rect x="60" y="120" width="130" height="64" rx="8" fill="#2f6fed" />
  <text x="125" y="148" class="label-main" text-anchor="middle">Statistical</text>
  <text x="125" y="166" class="label-main" text-anchor="middle">Blocker</text>

  <!-- Gate 1 -->
  <rect x="220" y="120" width="160" height="64" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5" />
  <text x="300" y="147" class="label-q1" text-anchor="middle">Is model choice</text>
  <text x="300" y="165" class="label-q2" text-anchor="middle">clear?</text>

  <!-- Gate 2 -->
  <rect x="410" y="120" width="160" height="64" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5" />
  <text x="490" y="147" class="label-q1" text-anchor="middle">Is code</text>
  <text x="490" y="165" class="label-q2" text-anchor="middle">executing?</text>

  <!-- Gate 3 -->
  <rect x="600" y="120" width="160" height="64" rx="8" fill="#f6f8fc" stroke="#cbd5e0" stroke-width="1.5" />
  <text x="680" y="147" class="label-q1" text-anchor="middle">Are results</text>
  <text x="680" y="165" class="label-q2" text-anchor="middle">surprising?</text>

  <!-- Outcome 1: Conceptual Blocker -->
  <rect x="220" y="250" width="160" height="64" rx="8" fill="#f0f5ff" stroke="#2f6fed" stroke-width="1.5" />
  <text x="300" y="278" class="label-out-title" text-anchor="middle">Conceptual</text>
  <text x="300" y="296" class="label-out-sub" text-anchor="middle">Blocker</text>

  <!-- Outcome 2: Computational Blocker -->
  <rect x="410" y="250" width="160" height="64" rx="8" fill="#f0f5ff" stroke="#2f6fed" stroke-width="1.5" />
  <text x="490" y="278" class="label-out-title" text-anchor="middle">Computational</text>
  <text x="490" y="296" class="label-out-sub" text-anchor="middle">Blocker</text>

  <!-- Outcome 3: Interpretive Blocker -->
  <rect x="600" y="250" width="160" height="64" rx="8" fill="#f0f5ff" stroke="#2f6fed" stroke-width="1.5" />
  <text x="680" y="278" class="label-out-title" text-anchor="middle">Interpretive</text>
  <text x="680" y="296" class="label-out-sub" text-anchor="middle">Blocker</text>

  <!-- Horizontal Connections -->
  <!-- Root -> Gate 1 -->
  <line x1="190" y1="152" x2="220" y2="152" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- Gate 1 -> Gate 2 (Yes) -->
  <line x1="380" y1="152" x2="410" y2="152" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="395" y="144" class="edge-label-neutral" text-anchor="middle">Yes</text>

  <!-- Gate 2 -> Gate 3 (Yes) -->
  <line x1="570" y1="152" x2="600" y2="152" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="585" y="144" class="edge-label-neutral" text-anchor="middle">Yes</text>

  <!-- Vertical Connections -->
  <!-- Gate 1 -> Conceptual (No) -->
  <line x1="300" y1="184" x2="300" y2="250" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="290" y="221" class="edge-label-accent" text-anchor="end">No</text>

  <!-- Gate 2 -> Computational (No) -->
  <line x1="490" y1="184" x2="490" y2="250" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="480" y="221" class="edge-label-accent" text-anchor="end">No</text>

  <!-- Gate 3 -> Interpretive (Yes) -->
  <line x1="680" y1="184" x2="680" y2="250" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="670" y="221" class="edge-label-accent" text-anchor="end">Yes</text>
<g opacity="0.72"><rect x="700" y="352" width="112" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="756" y="366.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64748b">scicoagent.com</text></g></svg>