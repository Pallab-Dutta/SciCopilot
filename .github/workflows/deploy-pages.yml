name: Deploy static site to Pages

# The landing page and agents hub are hand-written static files, served as-is. The blog is
# Hugo, and it is BUILT here rather than committed pre-built, so that:
#   - the markdown in blog-src/ is the single source of truth (no built HTML in git), and
#   - a post can be SCHEDULED: Hugo omits any post whose publishDate is still in the future,
#     so the hourly run below is what releases it, with no laptop involved.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Hourly: a post scheduled for 09:00 goes live on the first run after 09:00. This is the
  # ONLY reason a rebuild happens without a push. GitHub's cron is UTC and runs late, never
  # early, so a scheduled post appears at its time or shortly after — never before it.
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # Pinned: this exact version was verified to reproduce the live site byte-for-byte.
      # Hugo changes its HTML output between releases, so a floating version would silently
      # reformat the whole site one day.
      HUGO_VERSION: 0.163.3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Hugo
        # Straight from the official release rather than a third-party action: this job can
        # deploy the live site, so its trust list stays short.
        run: |
          set -euo pipefail
          curl -sSLo /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Stage the static site
        # Everything that is published, minus two things that are in the repo but are not the
        # website:
        #   blog-src/  the markdown and layouts. Uploading them would serve every post twice,
        #              once as HTML and once as raw .md. The repo is public, so this is
        #              tidiness, not secrecy.
        #   the local dev helpers. A static host cannot run them, so they were only ever
        #              downloadable source sitting on the marketing domain.
        #
        # NOT excluded, deliberately: index.md. It looks like a stray note, but agents.html
        # fetches it at runtime to build the tools tree — dropping it empties that page.
        run: |
          set -euo pipefail
          mkdir -p _site
          # Every pattern is ANCHORED with a leading slash. Without it rsync matches the
          # basename at any depth, so a bare 'app.py' would also delete scicolab/app.py and
          # the three scicopilot/* apps — four live pages, silently.
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            --exclude='/_site/' \
            --exclude='/blog/' \
            --exclude='/blog-src/' \
            --exclude='/app.py' \
            --exclude='/serve_hub.py' \
            --exclude='/start_hub.bat' \
            ./ _site/

      - name: Build the blog
        # Into the staged tree at /blog/, matching baseURL in blog-src/hugo.toml.
        run: hugo --minify --source blog-src --destination "$GITHUB_WORKSPACE/_site/blog"

      - name: Verify the build produced a site
        # Hugo exits non-zero on failure, but a misconfigured source can succeed and emit
        # almost nothing. Deploying that would quietly replace the blog with an empty shell,
        # and Pages has no undo — the bad deploy just becomes the site.
        run: |
          set -euo pipefail
          test -f _site/index.html || { echo "landing page missing"; exit 1; }
          test -f _site/blog/index.html || { echo "blog index missing"; exit 1; }
          posts=$(find _site/blog/posts -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "built $posts post(s)"
          test "$posts" -ge 1 || { echo "no posts built"; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping IndexNow for freshly changed URLs
        # Runs only after a successful deploy, so every submitted URL is already live.
        # Submits just the URLs whose sitemap <lastmod> is inside the window, so quiet
        # hourly rebuilds send nothing and a publish sends only what it touched. The key
        # is public by design (served at /<key>.txt), so it is not a secret. Best-effort:
        # the script never exits non-zero, so IndexNow can never fail a deploy.
        env:
          INDEXNOW_HOST: scicoagent.com
          INDEXNOW_KEY: 50c3c11a188d6e68487b3602e95ca5e5
          INDEXNOW_WINDOW_HOURS: "3"
        run: |
          python3 .github/scripts/indexnow_ping.py _site/sitemap.xml _site/blog/sitemap.xml
